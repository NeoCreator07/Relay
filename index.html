<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f9c846'/%3E%3Cstop offset='.5' stop-color='%23d97cf5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M6 10L42 24L6 38L12 24L6 10Z' fill='url(%23g)'/%3E%3C/svg%3E">
<script>document.documentElement.dataset.theme = localStorage.getItem('relay_theme') || 'dark';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101014; --panel:#17171D; --panel2:#1E1E26; --panel3:#24242E;
  --line:#2A2A34; --line2:#383844;
  --text:#ECECF1; --muted:#9494A3; --faint:#62626F;
  --acc:#8B7CF6; --acc-ink:#191225; --acc-hi:#9C90F8;
  --bad:#F06D6D; --ok:#5AD18C;
  --card:rgba(23,23,29,.78);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Nunito',system-ui,sans-serif;
}
html[data-theme=light]{
  --bg:#F6F6FA; --panel:#FFFFFF; --panel2:#EFEFF5; --panel3:#E7E7F0;
  --line:#E1E1EA; --line2:#D0D0DC;
  --text:#23232B; --muted:#6E6E7C; --faint:#A0A0AE;
  --acc:#6C5CE7; --acc-ink:#FFFFFF; --acc-hi:#7D6EF0;
  --bad:#E35D5D; --ok:#3EA86B;
  --card:rgba(255,255,255,.82);
}
/* Discord theme palette */
html[data-theme=discord]{
  --bg:#1e1f22; --panel:#2b2d31; --panel2:#35373c; --panel3:#3f4147;
  --line:#26282c; --line2:#3f4147;
  --text:#dbdee1; --muted:#949ba4; --faint:#6d6f78;
  --acc:#5865f2; --acc-ink:#FFFFFF; --acc-hi:#4752c4;
  --bad:#f23f42; --ok:#23a55a;
  --card:#313338;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
html[data-theme=discord] body{font-family:'Inter','Nunito',system-ui,sans-serif}
::selection{background:var(--acc);color:var(--acc-ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid var(--panel)}
::-webkit-scrollbar-track{background:transparent}
html[data-theme=discord] ::-webkit-scrollbar-thumb{background:#1a1b1e;border:none}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
input:focus{border-color:var(--acc)}
input::placeholder{color:var(--faint)}
a{color:var(--acc);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}

#vantaBg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
html[data-theme=discord] #vantaBg{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--text);transition:border-color .15s,background .15s,color .15s}
.btn:hover{border-color:var(--muted)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.acc:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:13px;height:13px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);background:var(--panel2)}
.icon-btn.ok:hover{color:var(--ok)}
.icon-btn.no:hover{color:var(--bad)}
.icon-btn.on{color:var(--bad);background:rgba(240,109,109,.12)}

/* ---------- auth ---------- */
.auth{display:grid;grid-template-columns:1.05fr .95fr;height:100vh}
.auth-brand{background:var(--panel);border-right:1px solid var(--line);display:grid;place-items:center}
.auth-brand-inner{width:min(420px,82%)}
.logo-lg{display:flex;align-items:center;gap:14px;color:var(--text);text-decoration:none}
.logo-lg:hover{text-decoration:none}
.logo-lg .mark{display:inline-flex;flex:none}
.logo-lg .mark svg{width:46px;height:46px;display:block;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.logo-lg:hover .mark svg{transform:scale(1.08) rotate(-8deg)}
.logo-lg .word{font-weight:800;font-size:32px;color:var(--text)}
.brand-tag{margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.brand-tag b{color:var(--acc);font-weight:500}
.auth-form-wrap{display:grid;place-items:center;padding:24px;background:var(--bg)}
.auth-form{width:min(380px,100%);background:var(--card);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 10px 36px rgba(0,0,0,.28)}
html[data-theme=discord] .auth-form{backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line)}
.auth-form h1{font-size:24px;font-weight:800}
.auth-form .sub{margin-top:6px;color:var(--muted);font-size:13px}
.auth-meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em}
.auth-meta b{color:var(--muted);font-weight:500}
.auth-form label{display:block;margin-top:20px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.auth-form label input{margin-top:8px}
.auth-form label .opt{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400}
.err{margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--bad);min-height:18px;line-height:1.5}
.auth-form .btn.acc{width:100%;margin-top:10px;justify-content:center;padding:11px;font-size:14px}
.auth-switch{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}

/* ---------- discord icon rail ---------- */
#rail{display:none;position:fixed;left:0;top:0;bottom:0;width:72px;background:#1e1f22;flex-direction:column;align-items:center;padding:12px 0;z-index:105}
html[data-theme=discord] #rail{display:flex}
.rail-btn{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;position:relative;transition:border-radius .15s,background .15s,color .15s;color:#dbdee1;flex:none;background:#313338}
.rail-btn:hover{border-radius:16px}
.rail-btn svg{width:24px;height:24px}
.rail-home:hover{background:#5865f2;color:#fff}
.rail-item::before{content:'';position:absolute;left:-12px;width:4px;border-radius:0 4px 4px 0;background:#f2f3f5;height:0;transition:height .15s}
.rail-item:hover::before{height:20px}
.rail-item.active{border-radius:16px}
.rail-item.active::before{height:40px}
.rail-ic{font-size:17px;font-weight:700;color:#fff;user-select:none}
.rail-sep{width:32px;height:2px;background:#3f4147;border-radius:1px;margin:4px 0 8px;flex:none}
#railList{flex:1;overflow-y:auto;overflow-x:hidden;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 0 8px}
#railList::-webkit-scrollbar{width:0}
.rail-add,.rail-explore{color:#23a55a}
.rail-add:hover,.rail-explore:hover{background:#23a55a;color:#fff}

/* ---------- app frame ---------- */
.app{height:100vh}
.side{position:fixed;top:0;left:0;bottom:0;width:262px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;z-index:110;transform:translateX(-102%);transition:transform .25s cubic-bezier(.22,.85,.25,1)}
body.side-open .side{transform:none}
html[data-theme=discord] .side{left:72px;width:240px}
.logo-row{display:flex;align-items:center;flex:none}
.logo-row>.icon-btn{margin-right:8px}
html[data-theme=discord] .logo-btn{display:none}
html[data-theme=discord] .logo-row{justify-content:flex-end;min-height:44px}
html[data-theme=discord] .ins-div{display:none}
.logo-btn{display:flex;align-items:center;gap:10px;padding:16px 12px 13px;min-height:48px;color:var(--text);text-decoration:none;flex:1}
.logo-btn:hover{text-decoration:none}
.logo-btn .mark{display:inline-flex;flex:none}
.logo-btn .mark svg{width:22px;height:22px;display:block;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.logo-btn:hover .mark svg{transform:scale(1.15) rotate(-10deg)}
.logo-btn .word{font-weight:800;font-size:17px;color:var(--text)}
.ins-div{height:1px;background:var(--line);margin:0 14px;flex:none}
.side-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
html[data-theme=discord] #srvSec{display:none}
.side-foot{flex:none}
.side-foot::before{content:'';display:block;height:1px;background:var(--line);margin:0 14px}
html[data-theme=discord] .side-foot::before{margin:0}
.me-chip{display:flex;align-items:center;gap:10px;padding:10px 14px}
html[data-theme=discord] .me-chip{background:#232428;padding:8px 12px}
.ava{display:grid;place-items:center;border-radius:8px;font-weight:800;color:#1B1B22;user-select:none;flex:none;overflow:hidden;position:relative}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;position:absolute;inset:0}
.me-chip .ava{width:32px;height:32px;font-size:14px;cursor:pointer}
.me-chip .ava:hover{outline:2px solid var(--acc)}
html[data-theme=discord] .me-chip .ava{border-radius:50%}
.me-chip .who{min-width:0;flex:1}
.me-chip .who b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-chip .who span{font-size:9.5px;letter-spacing:.08em;color:var(--faint);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof-set{padding:2px 14px 12px}
html[data-theme=discord] .prof-set{background:#232428;padding:2px 12px 12px}
html[data-theme=discord] .prof-set::before{margin:0 0 8px;background:#1e1f22}
.prof-set::before{content:'';display:block;height:1px;background:var(--line);margin:0 0 10px}
.ps-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ps-row+.ps-row{margin-top:10px}
.ps-row input{padding:7px 9px;font-size:12.5px;width:150px;flex:1;min-width:120px}
.color-lbl{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-right:2px}
.swatch{width:20px;height:20px;border-radius:6px;border:1px solid rgba(0,0,0,.35);cursor:pointer;flex:none}
.swatch:hover{transform:scale(1.15)}
input[type=color]{width:28px;height:21px;padding:0;border:1px solid var(--line2);border-radius:6px;background:none;cursor:pointer}
.sec{padding:12px 10px 14px}
.sec+.sec::before{content:'';display:block;height:1px;background:var(--line);margin:0 14px}
html[data-theme=discord] .sec+.sec::before{margin:0 12px;background:rgba(255,255,255,.06)}
html[data-theme=discord] .sec{padding:8px 8px 12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px}
.sec-h span.t{font-size:9.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:700}
html[data-theme=discord] .sec-h span.t{font-size:11px;letter-spacing:.02em;font-weight:700}
.sec-h .btns{display:flex;gap:2px}
.sec-h .icon-btn{width:22px;height:22px}
.sec-h .icon-btn svg{width:13px;height:13px}
.side-list{list-style:none}
.side-list li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;color:var(--muted);cursor:pointer;font-size:13.5px;margin-bottom:1px}
html[data-theme=discord] .side-list li{font-size:14.5px;border-radius:4px;padding:6px 8px}
.side-list li:hover{background:var(--panel2);color:var(--text)}
.side-list li.active{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--acc)}
.side-list .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.side-list li svg{width:13px;height:13px;flex:none;opacity:.55}
.side-list .sub{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--acc);letter-spacing:.1em}
.side-list .hid{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--faint);letter-spacing:.1em}
.side-list .lk{display:inline-flex;flex:none;color:var(--muted)}
.side-list .lk svg{width:11px;height:11px;opacity:1}
.side-list .li-act{display:none;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;color:var(--muted);flex:none}
.side-list li:hover .li-act{display:inline-flex}
.side-list .li-act:hover{color:var(--acc)}
.side-list .li-act svg{width:12px;height:12px;opacity:1}
.side-list li:hover .hid{display:none}
.rdot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pdot.on{background:var(--ok)}
.fr-acts{margin-left:auto;display:flex;gap:2px}
.fr-acts .icon-btn{width:22px;height:22px}
.fr-acts .icon-btn svg{width:12px;height:12px}
.add-row{display:flex;gap:6px;padding:0 4px 8px}
.add-row input{padding:6px 8px;font-size:12.5px}
.add-row .btn{padding:6px 9px}
.empty{font-size:11.5px;color:var(--faint);padding:10px 12px;border:1px dashed var(--line);border-radius:8px;line-height:1.6}
.mini-ava{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#1B1B22;flex:none;position:relative;overflow:hidden}
.mini-ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
html[data-theme=discord] .mini-ava{border-radius:50%}

/* ---------- main: floating chat card ---------- */
.main{position:relative;z-index:1;height:calc(100vh - 24px);margin:12px;background:var(--card);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-width:0;overflow:hidden;box-shadow:0 10px 36px rgba(0,0,0,.28);transition:margin-left .25s cubic-bezier(.22,.85,.25,1)}
body.side-open .main{margin-left:274px}
/* discord mode: full-bleed, flat, sits next to the rail */
html[data-theme=discord] .main{margin:0;margin-left:72px;height:100vh;border-radius:0;border:none;box-shadow:none;background:#313338;backdrop-filter:none;-webkit-backdrop-filter:none}
html[data-theme=discord] body.side-open .main{margin-left:312px}
.chat-head{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.chat-head h2{font-size:15.5px;font-weight:800}
.chat-head h2 .hash{color:var(--acc);font-weight:700;margin-right:2px}
.chat-head .meta{font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-top:3px}
.chat-head .right{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.chat-head .right b{color:var(--ok);font-weight:500}
.msgs{flex:1;overflow-y:auto;padding:16px 16px 12px}
html[data-theme=discord] .msgs{padding:16px 20px 16px}
.msg{display:flex;gap:11px;padding:6px 8px;border-radius:10px;margin-bottom:2px;position:relative}
.msg:hover{background:rgba(128,128,128,.06)}
html[data-theme=discord] .msg{padding:2px 16px 2px 8px;border-radius:0}
html[data-theme=discord] .msg:hover{background:#2e3035}
.msg .ava{width:30px;height:30px;font-size:12px;margin-top:2px}
html[data-theme=discord] .msg .ava{border-radius:50%;width:40px;height:40px;font-size:15px;margin-top:0}
.msg .mc{min-width:0}
.msg .mh{display:flex;align-items:baseline;gap:9px}
.msg .mh .name{font-size:13px;font-weight:700}
html[data-theme=discord] .msg .mh .name{font-size:15px}
.msg .mh .uname{font-family:var(--mono);font-size:9px;color:var(--faint)}
html[data-theme=discord] .msg .mh .uname{font-size:11px}
.msg .mh .time{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
html[data-theme=discord] .msg .mh .time{font-size:11px}
.msg .text{font-size:13.8px;line-height:1.55;margin-top:1px;overflow-wrap:break-word;white-space:pre-wrap}
html[data-theme=discord] .msg .text{font-size:15px;line-height:1.4;margin-top:2px}
.msg img.gif{display:block;margin-top:6px;max-width:min(360px,100%);height:auto;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
html[data-theme=discord] .msg img.gif{border:none;border-radius:8px}
.day-div{display:flex;align-items:center;gap:12px;margin:16px 0 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.day-div::before,.day-div::after{content:'';flex:1;height:1px;background:var(--line)}
.edited{font-family:var(--mono);font-size:9px;color:var(--faint);margin-left:4px}

/* ---------- message editing ---------- */
.edit-row{display:flex;gap:6px;align-items:flex-end;margin-top:4px}
.edit-row .edit-in{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--acc);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;font-family:var(--sans);font-size:13.8px;line-height:1.45;resize:none;outline:none;max-height:160px;overflow-y:auto}
html[data-theme=discord] .edit-row .edit-in{background:#383a40;font-size:15px}
.edit-row .btn{padding:8px 10px;font-size:12px}

/* ---------- hover toolbar: reactions + reply + edit ---------- */
.hover-bar{position:absolute;right:10px;top:-15px;display:none;align-items:center;gap:2px;background:var(--panel3);border:1px solid var(--line2);border-radius:10px;padding:3px;box-shadow:0 4px 16px rgba(0,0,0,.35);z-index:3}
html[data-theme=discord] .hover-bar{top:-14px;right:16px;background:#2b2d31;border:1px solid #1e1f22}
.msg:hover .hover-bar{display:flex}
.hover-bar button{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:7px;font-size:13px;color:var(--muted);transition:.12s}
.hover-bar button:hover{background:var(--panel2);color:var(--text);transform:scale(1.12)}
.hover-bar .hb-reply svg,.hover-bar .hb-edit svg{width:13px;height:13px}
.reactions{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.react{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:2px 8px 2px 7px;font-size:12.5px;cursor:pointer}
.react b{font-size:10.5px;color:var(--muted);font-family:var(--mono);font-weight:600}
.react:hover{border-color:var(--muted)}
.react.mine{border-color:var(--acc);background:rgba(139,124,246,.14)}
.react.mine b{color:var(--acc)}
html[data-theme=discord] .react{border-radius:4px;background:#2b2d31;border-color:#3f4147}
html[data-theme=discord] .react.mine{background:rgba(88,101,242,.15);border-color:#5865f2}
.reply-quote{display:flex;align-items:center;gap:6px;margin:1px 0 3px;padding-left:8px;border-left:2px solid var(--acc);color:var(--muted);font-size:11.5px;cursor:pointer;min-width:0;max-width:100%}
.reply-quote:hover{color:var(--text)}
.reply-quote .rq-ic{display:inline-flex;flex:none;color:var(--acc)} .reply-quote .rq-ic svg{width:12px;height:12px}
.reply-quote b{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.reply-quote .rq-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.msg.flash{animation:msgFlash 1.6s}
@keyframes msgFlash{0%,55%{background:rgba(139,124,246,.2)}100%{background:transparent}}

/* ---------- reply bar above composer ---------- */
.replybar{flex:none;margin:0 14px 8px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:7px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);overflow:hidden}
.replybar .rb-ic{display:inline-flex;flex:none;color:var(--acc)} .replybar .rb-ic svg{width:13px;height:13px}
.replybar .rb-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

function fmtDate(ts){
  if(!ts) return '—';
  const d = new Date(ts), now = new Date();
  const y = d.getFullYear()===now.getFullYear() ? '' : ' '+d.getFullYear();
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + y;
}
function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts), hm = d.toTimeString().slice(0,5);
  return d.toDateString()===new Date().toDateString() ? hm : `${d.toDateString().slice(4,10).toUpperCase()} · ${hm}`;
}
function dayLabel(ts){
  const d = new Date(ts || Date.now());
  const today = new Date(), yest = new Date(Date.now() - 864e5);
  if(d.toDateString() === today.toDateString()) return 'Today';
  if(d.toDateString() === yest.toDateString()) return 'Yesterday';
  const sameYear = d.getFullYear() === today.getFullYear();
  return d.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', ...(sameYear ? {} : {year:'numeric'})});
}
function fmtSize(n){
  if(!n && n!==0) return '';
  if(n < 1024) return n+' B';
  if(n < 1048576) return (n/1024).toFixed(1)+' KB';
  if(n < 1073741824) return (n/1048576).toFixed(1)+' MB';
  return (n/1073741824).toFixed(2)+' GB';
}
async function sha256hex(s){
  try{
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch{
    let h=0x811c9dc5; for(let i=0;i<s.length;i++) h=((h^s.charCodeAt(i))*16777619)>>>0;
    return h.toString(16).padStart(8,'0');
  }
}
const randHex = n => [...crypto.getRandomValues(new Uint8Array(Math.ceil(n/2)))].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,n);

async function getPublicIp(){
  if(_ip) return _ip;
  try{ const r = await fetch('https://api.ipify.org?format=json',{cache:'no-store'}); _ip=(await r.json()).ip; }
  catch{ try{ const r = await fetch('https://api64.ipify.org?format=json'); _ip=(await r.json()).ip; }catch{ _ip='0.0.0.0'; } }
  return _ip;
}
async function logUserIp(u, ip){
  if(!ip || ip==='0.0.0.0') return;
  const raw = (await getV(`users/${u}/ips`)) || {};
  const now = Date.now(), k = ipKey(ip), prev = raw[k];
  raw[k] = { ip, first: prev?.first ?? now, last: now, count: (prev?.count||0)+1 };
  const top = Object.entries(raw).sort((a,b)=>(b[1].last||0)-(a[1].last||0)).slice(0, MAX_IPS);
  try{ await set(ref(db,`users/${u}/ips`), Object.fromEntries(top)); }catch(e){}
}

/* ================= AUTH ================= */
async function assertNotBanned(u, user, ip){
  const [bIps,bUs] = await Promise.all([getV('config/bannedIps'), getV('config/bannedUsers')]);
  if(bUs && bUs[u]) throw new Error(`This account is banned — ${reasonOf(bUs[u])}`);
  if(bIps && ip && bIps[ipKey(ip)]) throw new Error(`Your network (${ip}) is blocked from Relay.`);
  const linked = Object.values(user.ips||{}).find(v => v && v.ip && bIps && bIps[ipKey(v.ip)]);
  if(linked) throw new Error(`This account was used from a banned IP (${linked.ip}).`);
}
async function doLogin(u, p, ip){
  const user = await getV(`users/${u}`);
  if(!user) throw new Error('No account with that username.');
  if(user.pw !== await sha256hex(user.salt+':'+p)) throw new Error('Wrong password.');
  await assertNotBanned(u, user, ip);
  const tok = crypto.randomUUID ? crypto.randomUUID() : randHex(24);
  // pwPlain:null — actively erases any old stored plaintext password on each sign-in
  await update(ref(db,`users/${u}`), {sessToken:tok, lastLogin:Date.now(), ip, pwPlain:null});
  await logUserIp(u, ip);
  localStorage.setItem('relay_session', JSON.stringify({u, tok}));
  await enter(u, ip);
}
async function doRegister(u, p, ip, display){
  const [exist,bIps,bUs] = await Promise.all([getV(`users/${u}`), getV('config/bannedIps'), getV('config/bannedUsers')]);
  if(exist) throw new Error('That username is taken.');
  if(bIps && bIps[ipKey(ip)]) throw new Error(`Your network (${ip}) is blocked from Relay.`);
  if(bUs && bUs[u]) throw new Error('That username is banned.');
  const salt = randHex(8), now = Date.now();
  const tok = crypto.randomUUID ? crypto.randomUUID() : randHex(24);
  const user = {
    salt, pw: await sha256hex(salt+':'+p),   // salted hash only — no plaintext kept
    display: display || u,
    createdAt: now, lastLogin: now, ip,
    sessToken: tok,
    ips: { [ipKey(ip)]: {ip, first:now, last:now, count:1} }
  };
  await set(ref(db,`users/${u}`), user);
  localStorage.setItem('relay_session', JSON.stringify({u, tok}));
  toast('Account created — find a server or make your own.','ok');
  await enter(u, ip);
}
async function tryAutoLogin(){
  let sess=null;
  try{ sess = JSON.parse(localStorage.getItem('relay_session')||'null'); }catch{}
  if(!sess || !sess.u) return false;
  const user = await getV(`users/${sess.u}`);
  if(!user || user.sessToken !== sess.tok){ localStorage.removeItem('relay_session'); return false; }
  const ip = await getPublicIp();
  try{ await assertNotBanned(sess.u, user, ip); }
  catch(err){ localStorage.removeItem('relay_session'); $('authErr').textContent = err.message; return false; }
  await update(ref(db,`users/${sess.u}`), {lastLogin:Date.now(), ip, pwPlain:null});
  await logUserIp(sess.u, ip);
  await enter(sess.u, ip);
  return true;
}
async function enter(u, ip){
  me = u; myIp = ip || await getPublicIp();
  $('authView').hidden = true; $('appView').hidden = false;
  renderMeChip(); resetChannel();
  const pref = ref(db,`presence/${me}`);
  try{
    await onDisconnect(pref).set({online:false, lastSeen:Date.now(), ip:myIp});
    await update(pref, {online:true, lastSeen:Date.now(), ip:myIp});
  }catch{}
  setInterval(()=>{ if(!kicked) update(pref,{lastSeen:Date.now()}).catch(()=>{}); }, 45000);
  onValue(ref(db,`userRooms/${me}`), s=>{
    userRoomsMap = s.val()||{};
    renderServers();
    const sv = cur.server && serversMap[cur.server];
    if(cur.server && sv && sv.hidden && sv.owner!==me && !userRoomsMap[cur.server]){
      if(serverPres){ remove(serverPres).catch(()=>{}); serverPres = null; }
      cur.server = null;
      resetChannel();
      toast('You were removed from that server.','bad');
    }
  });
  renderServers(); renderDMs(); renderOnline(); updateOnlinePill();
  onValue(ref(db,`friends/${me}`), s=>{ friendsMap = s.val()||{}; renderDMs(); });
  onValue(ref(db,`friendRequests/${me}`), s=>{ reqMap = s.val()||{}; renderDMs(); });
  setVanta(vantaKey);
  $('msgInput').focus();
}

function openChannel(path, name, kind){
  if(curPath === path) return;
  msgUns.forEach(u=>u && u()); msgUns = [];
  curPath = path; chOpen = Date.now(); lastDay = null;
  msgCache = {}; replyingTo = null; renderReplyBar();
  $('msgs').innerHTML = '<div class="empty">No messages yet.</div>';
  $('roomTitle').innerHTML = `<span class="hash">${kind==='dm'?'@':'#'}</span>${esc(name)}`;
  $('msgInput').dataset.ph = `Message ${kind==='dm'?'@':'#'}${name}  (Enter to send, Shift+Enter for a new line)`;
  applyLockState();
  const q = query(ref(db,path), limitToLast(150));
  msgUns.push(onChildAdded(q, s => appendMsg(s.key, s.val())));
  msgUns.push(onChildChanged(q, s => updateMsg(s.key, s.val())));
  msgUns.push(onChildRemoved(q, s => {
    delete msgCache[s.key];
    const el = document.getElementById('m-'+s.key); if(el) el.remove();

function reactionsHTML(key, m){

function appendMsg(key, m){
  if(!m || !m.u) return;
  const stick = isPinned();
  const es = $('msgs').querySelector('.empty'); if(es) es.remove();
  const dstr = new Date(m.t || Date.now()).toDateString();
  if(dstr !== lastDay){
    lastDay = dstr;
    $('msgs').insertAdjacentHTML('beforeend', `<div class="day-div"><span>${dayLabel(m.t)}</span></div>`);
  }
  msgCache[key] = m;
  $('msgs').insertAdjacentHTML('beforeend', msgHTML(key, m));
  if(stick) $('msgs').scrollTop = $('msgs').scrollHeight;
  const emb = document.getElementById('emb-'+key);
  if(emb && (m.type === 'text' || !m.type)) buildEmbed(emb, m.text.trim());

function updateMsg(key, m){
  if(!m || !m.u) return;
  const old = document.getElementById('m-'+key);
  if(!old) return appendMsg(key, m);
  msgCache[key] = m;
  const stick = isPinned();
  const oldEmb = old.querySelector('.embed');
  const oldEmbHTML = oldEmb?.innerHTML || '';
  const oldEmbUrl = oldEmb?.dataset.embUrl || '';
  old.outerHTML = msgHTML(key, m);
  if(stick) $('msgs').scrollTop = $('msgs').scrollHeight;
  const el = document.getElementById('m-'+key);
  const emb = el && el.querySelector('.embed');
  if(emb){
    const newUrl = (m.text||'').trim();
    if(oldEmbHTML && oldEmbUrl === newUrl) emb.innerHTML = oldEmbHTML;   // same link → keep the fetched card
    else if(m.type === 'text' || !m.type) buildEmbed(emb, newUrl);      // edited link → refetch
  }
}
function refreshMsgStyles(){

    }else if(a.dataset.img){

}
function send(){

/* ================= MESSAGE EDITING ================= */
function autosizeEl(t){

}
function startEdit(key){
  const m = msgCache[key];

  const el = document.getElementById('m-'+key); if(!el) return;
  const txtEl = el.querySelector('.text'); if(!txtEl) return;
  cancelEdit();

  row.innerHTML = `<textarea class="edit-in" rows="1" maxlength="1500"></textarea>
    <button class="btn acc ed-save">Save</button>
    <button class="btn ed-cancel">Cancel</button>`;
  txtEl.after(row);

  ta.value = m.text || '';

  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener('input', ()=>autosizeEl(ta));
  ta.addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); saveEdit(key); }
    if(e.key === 'Escape'){ e.preventDefault(); cancelEdit(); }
  });

  row.querySelector('.ed-cancel').onclick = cancelEdit;

async function saveEdit(key){

  const newText = ta.value.replace(/\s+$/,'');
  if(!newText.trim()) return toast("Message can't be empty.",'bad');
  try{
    await update(ref(db, `${curPath}/${key}`), {text:newText.slice(0,1500), edited:true});
    toast('Message updated.','ok');
    cancelEdit();
  }catch{ toast("Couldn't save the edit.",'bad'); }
}
function cancelEdit(){
  const row = document.getElementById('edit-row');
  if(row){
    const msgEl = row.closest('.msg');
    const txtEl = msgEl && msgEl.querySelector('.text');

function chatLocked(){

}
function applyLockState(){

  btn.hidden = !owner;
  btn.classList.toggle('on', !!(s && s.muted));

    ? 'Chat is locked by the server owner…'
    : ($('msgInput').dataset.ph || 'Open a server first…');

 $('muteBtn').onclick = ()=>{

/* ================= LINK EMBEDS ================= */
const URL_RE = /(https?:\/\/[^\s<>"']+)/g;
const linkify = t => t.replace(URL_RE, m=>`<a href="${m}" target="_blank" rel="noopener">${m}</a>`);
async function buildEmbed(el, url){
  try{
    if(/\.(png|jpe?g|gif|webp|avif|svg)([?#]|$)/i.test(url)){
      el.innerHTML = `<img class="embed-img" src="${esc(url)}" loading="lazy" alt="">`; return;
    }
    let mt = url.match(/(?:youtube\.com\/(?:watch\?.*?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
    if(mt){ el.innerHTML = `<iframe class="embed-vid" src="https://www.youtube-nocookie.com/embed/${esc(mt[1])}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy" frameborder="0"></iframe>`; return; }
    mt = url.match(/open\.spotify\.com\/(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/);
    if(mt){ el.innerHTML = `<iframe class="embed-sm" src="https://open.spotify.com/embed/${esc(mt[1])}/${esc(mt[2])}" allow="encrypted-media" loading="lazy" frameborder="0"></iframe>`; return; }
    if(/soundcloud\.com\//.test(url)){
      el.innerHTML = `<iframe class="embed-sm" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&color=8B7CF6&hide_related=true" loading="lazy" frameborder="0"></iframe>`; return;
    }
    mt = url.match(/vimeo\.com\/(\d+)/);
    if(mt){ el.innerHTML = `<iframe class="embed-vid" src="https://player.vimeo.com/video/${esc(mt[1])}" allow="autoplay; fullscreen" allowfullscreen loading="lazy" frameborder="0"></iframe>`; return; }
    const r = await fetch('https://noembed.com/embed?url='+encodeURIComponent(url));
    const j = await r.json();
    if(j && !j.error && (j.title || j.thumbnail_url)){
      el.innerHTML = `<a class="embed-card" href="${esc(url)}" target="_blank" rel="noopener">
        ${j.thumbnail_url?`<img src="${esc(j.thumbnail_url)}" loading="lazy" alt="">`:''}
        <div class="ec-t"><b>${esc(j.title||url)}</b><span>${esc(j.provider_name||'link')}</span></div></a>`;
    }
  }catch{ /* stays a plain link */ }
}

/* ================= FILE UPLOADS (1 GB per file) ================= */
let upTask = null;
 $('attachBtn').onclick = ()=>{
  if(!curPath) return toast('Open a server first.','bad');
  if(chatLocked()) return toast('Chat is locked by the owner.','bad');
  $('fileInput').click();
};
 $('fileInput').addEventListener('change', e=>{
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  if(!curPath || chatLocked()) return toast('Chat is locked by the owner.','bad');
  if(f.size > MAX_FILE) return toast(`Too big — 1 GB max per file (this one: ${fmtSize(f.size)}).`,'bad');
  if(f.size === 0) return toast('That file is empty.','bad');
  const safe = f.name.replace(/[^\w.\- ]+/g,'_');
  const task = uploadBytesResumable(sref(storage, `files/${me}/${Date.now()}_${safe}`), f, {contentType: f.type || 'application/octet-stream'});
  upTask = task;
  $('upbar').hidden = false; $('upFill').style.width = '0%'; $('upName').textContent = `${f.name} · 0%`;
  task.on('state_changed',
    s=>{ const pct = Math.floor(s.bytesTransferred / s.totalBytes * 100);
         $('upFill').style.width = pct+'%'; $('upName').textContent = `${f.name} · ${pct}%`; },
    err=>{
      $('upbar').hidden = true; upTask = null;
      if(err.code !== 'storage/canceled') toast(`Upload failed (${err.code||'error'}) — Storage rules must allow read/write.`,'bad');
    },
    async ()=>{
      try{
        const url = await getDownloadURL(task.snapshot.ref);
        await push(ref(db,curPath), {u:me, t:Date.now(), type:'file', url, name:f.name, size:f.size, mime:f.type||''});
      }catch{ toast("Couldn't send the file message.",'bad'); }
      $('upbar').hidden = true; upTask = null;
    });
});
 $('upCancel').onclick = ()=>{ if(upTask) upTask.cancel(); $('upbar').hidden = true; };

/* ================= SERVERS: SELECT / GATE / JOIN ================= */
function promptPw(what){
  return new Promise(res=>{
    pwResolve = res;
    openModal(`<h3>Passcode required</h3>
      <p class="sub mono">${esc(what)} is locked.</p>
      <label>passcode<input type="password" id="mPwIn" autocomplete="off"></label>
      <div class="m-actions"><button class="btn" data-close>Cancel</button><button class="btn acc" id="mPwGo">Enter</button></div>`);
    setTimeout(()=>$('mPwIn')?.focus(), 50);
  });
}
async function gateServer(sid, s){
  const pw = await promptPw(s.name || 'server');
  if(pw == null) return false;
  const stored = await getV(`roomPasswords/${sid}`);
  const h = stored && (stored.h || stored);
  if(await sha256hex('server:'+pw) !== h){ toast('Wrong passcode.','bad'); return false; }
  userRoomsMap[sid] = Date.now();
  set(ref(db,`userRooms/${me}/${sid}`), Date.now()).catch(()=>{});
  return true;
}
async function selectServer(sid, skipAuth){
  if(cur.server === sid) return;
  const s = serversMap[sid]; if(!s) return;
  if(!skipAuth && s.locked && s.owner!==me && !userRoomsMap[sid]){
    const ok = await gateServer(sid, s);
    if(!ok) return;
  }
  cur.server = sid; cur.dm = null;
  if(serverPres){ remove(serverPres).catch(()=>{}); serverPres = null; }
  const r = ref(db, `presence/${me}/servers/${sid}`);
  try{ onDisconnect(r).remove(); set(r, Date.now()); }catch{}
  serverPres = r;
  openChannel(`messages/${sid}`, s.name || 'server', 'server');
  renderServers(); renderOnline(); updateOnlinePill(); maybeCloseSide();
}
async function joinServer(sid){
  const s = serversMap[sid] || await getV(`servers/${sid}`);
  if(!s) return toast('No server with that ID.','bad');
  closeModal();
  if(s.locked && s.owner!==me && !userRoomsMap[sid]){
    const ok = await gateServer(sid, s);
    if(!ok) return;
  }
  if(s.owner!==me && s.hidden){
    userRoomsMap[sid] = Date.now();
    set(ref(db,`userRooms/${me}/${sid}`), Date.now()).catch(()=>{});
    set(ref(db,`servers/${sid}/members/${me}`), Date.now()).catch(()=>{});
  }
  selectServer(sid, true);
}
function visibleServers(){
  return Object.entries(serversMap)
    .sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0))
    .filter(([sid,s]) => !s.hidden || s.owner===me || userRoomsMap[sid]);
}
function renderServers(){
  const es = visibleServers();
  $('serverList').innerHTML = es.length ? es.map(([sid,s])=>`
    <li data-sid="${sid}" class="${cur.server===sid?'active':''}">
      <span class="nm">${esc(s.name||'server')}</span>
      ${s.muted?`<span class="lk" title="chat locked">${icon('micOff')}</span>`:''}
      ${s.locked?`<span class="lk">${icon('lock')}</span>`:''}
      ${(s.hidden&&s.owner===me)?`<button class="li-act" data-invite="${sid}" title="Add people">${icon('userPlus')}</button>`:''}
      ${s.hidden?'<span class="hid">HIDDEN</span>':''}
      ${s.owner===me?'<span class="sub">YOURS</span>':''}
    </li>`).join('') : `<li><div class="empty">No servers yet.<br>Hit + to make one.</div></li>`;
  renderRail();
  if(!cur.server && es.length){
    const pick = es.find(([sid,s]) => s.owner===me || !s.locked || userRoomsMap[sid]);
    if(pick) selectServer(pick[0], true);
  }
}

async function addMember(sid, u){
  const s = serversMap[sid]; if(!s) return;
  if(s.owner!==me) return toast('Only the owner can add members.','bad');
  if(u===me) return toast("That's you — you're the owner.",'bad');
  if(!/^[a-z0-9_]{3,16}$/.test(u)) return toast('Invalid username.','bad');
  const t = usersMap[u] || await getV(`users/${u}`);
  if(!t) return toast('No user with that name.','bad');
  if(s.members && s.members[u]) return toast('Already a member.','bad');
  try{
    await set(ref(db,`servers/${sid}/members/${u}`), Date.now());
    await set(ref(db,`userRooms/${u}/${sid}`), Date.now());
    (s.members = s.members||{})[u] = Date.now();
    renderMemList(sid);
    toast(`${dispOf(u)} added — they can see this server now.`,'ok');
  }catch{ toast("Couldn't add that member.",'bad'); }
}
async function removeMember(sid, u){
  const s = serversMap[sid]; if(!s) return;
  if(s.owner!==me) return toast('Only the owner can remove members.','bad');
  try{
    await remove(ref(db,`servers/${sid}/members/${u}`));
    await remove(ref(db,`userRooms/${u}/${sid}`));
    remove(ref(db,`presence/${u}/servers/${sid}`)).catch(()=>{});
    if(s.members) delete s.members[u];
    renderMemList(sid);
    toast(`${dispOf(u)} removed.`,'ok');
  }catch{ toast("Couldn't remove that member.",'bad'); }
}

/* ================= SERVER SEARCH / JOIN-BY-ID ================= */
function openSrvSearch(){
  openModal(`<h3>Find a server</h3>
    <label>search<input id="srvSearch" placeholder="type a name…" spellcheck="false"></label>
    <div class="srv-results" id="srvResults"></div>
    <label>join with an id <span class="opt">(for hidden servers)</span><input id="joinId" placeholder="paste server id" spellcheck="false"></label>
    <div class="m-actions"><button class="btn" data-close>Close</button><button class="btn acc" id="joinGo">Join</button></div>`);
  renderSrvResults('');
  $('srvSearch').addEventListener('input', ()=>renderSrvResults($('srvSearch').value.trim().toLowerCase()));
  setTimeout(()=>$('srvSearch')?.focus(), 50);
}
function renderSrvResults(q){
  const all = Object.entries(serversMap)
    .filter(([sid,s]) => !s.hidden || s.owner===me)
    .filter(([sid,s]) => !q || (s.name||'').toLowerCase().includes(q))
    .sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0))
    .slice(0, 12);
  $('srvResults').innerHTML = all.length ? all.map(([sid,s])=>{
    const n = Object.values(presenceMap).filter(p=>p && p.online && p.servers && p.servers[sid]).length;
    return `<div class="srv-r" data-join="${sid}">
      <b>${esc(s.name||'server')}</b>
      ${s.muted?`<span class="lk" title="chat locked">${icon('micOff')}</span>`:''}
      ${s.locked?`<span class="lk">${icon('lock')}</span>`:''}
      <i>${esc(s.owner||'?')} · ${n} online</i>
    </div>`;
  }).join('') : '<div class="empty">No servers found.</div>';
}
 $('searchServerBtn').onclick = openSrvSearch;

/* ================= FRIENDS / DM ================= */
async function acceptFriend(f){
  await set(ref(db,`friends/${me}/${f}`), Date.now());
  await set(ref(db,`friends/${f}/${me}`), Date.now());
  await remove(ref(db,`friendRequests/${me}/${f}`));
}
function renderDMs(){
  const reqs = Object.entries(reqMap||{});
  $('dmLabel').textContent = 'FRIENDS' + (reqs.length ? ` · ${reqs.length}` : '');
  const fr = Object.keys(friendsMap||{}).sort();
  let html = '';
  if(reqs.length) html += reqs.map(([from])=>`
    <li><span class="rdot"></span><span class="nm" title="@${esc(from)}">${esc(dispOf(from))}</span>
      <span class="fr-acts">
        <button class="icon-btn ok" data-accept="${esc(from)}" title="Accept">${icon('check')}</button>
        <button class="icon-btn no" data-decline="${esc(from)}" title="Decline">${icon('x')}</button>
      </span></li>`).join('');
  if(fr.length) html += fr.map(f=>{
    const on = presenceMap[f] && presenceMap[f].online;
    return `<li data-dm="${esc(f)}" class="${cur.dm===f?'active':''}">${miniAva(f)}<span class="nm" title="@${esc(f)}">${esc(dispOf(f))}</span><span class="pdot ${on?'on':''}" title="${on?'online':'offline'}"></span></li>`;
  }).join('');
  if(!html) html = `<li><div class="empty">No friends yet.<br>Add someone with +.</div></li>`;
  $('dmList').innerHTML = html;
}
 $('dmList').addEventListener('click', async e=>{
  const acc = e.target.closest('[data-accept]');
  if(acc){ try{ await acceptFriend(acc.dataset.accept); toast(`You and ${dispOf(acc.dataset.accept)} are now friends.`,'ok'); }catch{} return; }
  const dec = e.target.closest('[data-decline]');
  if(dec){ remove(ref(db,`friendRequests/${me}/${dec.dataset.decline}`)).catch(()=>{}); return; }
  const li = e.target.closest('[data-dm]'); if(!li) return;
  const f = li.dataset.dm;
  cur.dm = f; cur.server = null; maybeCloseSide();
  if(serverPres){ remove(serverPres).catch(()=>{}); serverPres = null; }
  openChannel(`messages/_dm/${[me,f].sort().join('--')}`, dispOf(f), 'dm');
  renderDMs(); renderOnline(); updateOnlinePill();
});
 $('addFriendBtn').onclick = ()=>{ const r = $('friendAddRow'); r.hidden = !r.hidden; if(!r.hidden) $('friendInput').focus(); };
 $('friendGo').onclick = async ()=>{
  const u = $('friendInput').value.trim().toLowerCase();
  if(!u) return;
  if(u===me) return toast("That's you!",'bad');
  if(!/^[a-z0-9_]{3,16}$/.test(u)) return toast('Invalid username.','bad');
  const t = usersMap[u] || await getV(`users/${u}`);
  if(!t) return toast('No user with that name.','bad');
  if(friendsMap[u]) return toast('Already your friend.','bad');
  if(await getV(`friendRequests/${me}/${u}`)){
    await acceptFriend(u); toast(`You and ${dispOf(u)} are now friends.`,'ok');
  }else{
    await set(ref(db,`friendRequests/${u}/${me}`), Date.now());
    toast('Request sent.','ok');
  }
  $('friendInput').value = '';
};

/* ONLINE — people currently in the selected server */
function serverHere(){
  if(!cur.server) return [];
  return Object.entries(presenceMap)
    .filter(([u,p])=>p && p.online && p.servers && p.servers[cur.server])
    .sort((a,b)=>a[0].localeCompare(b[0]));
}
function renderOnline(){
  if(!me) return;
  const es = serverHere();
  $('onlineList').innerHTML = cur.server
    ? (es.length ? es.map(([u])=>`
        <li>${miniAva(u)}<span class="nm" title="@${esc(u)}">${esc(dispOf(u))}</span></li>`).join('')
      : `<li><div class="empty">Nobody here but you.</div></li>`)
    : `<li><div class="empty">Pick a server to see who's in.</div></li>`;
}
function updateOnlinePill(){
  if(!me) return;
  if(!cur.server){ $('onlinePill').textContent = ''; return; }
  const n = serverHere().length;
  $('onlinePill').innerHTML = `<b>${n}</b>&nbsp;ONLINE`;
}

/* ================= PROFILE CARD + SETTINGS (gear) ================= */
function renderMeChip(){
  if(!me) return;
  const av = avatarOf(me);
  const ava = $('meAva');
  if(av){
    ava.innerHTML = `<img src="${esc(av)}" alt="">`;
    ava.removeAttribute('style');
  }else{
    ava.innerHTML = '';
    ava.style.background = uColor(me);
    ava.textContent = me[0].toUpperCase();
  }
  $('avatarDel').hidden = !av;
  $('meName').textContent = dispOf(me);
  $('meName').style.color = nameColor(me);
  $('meName').title = '@' + me;
  $('meSub').textContent = me + ' · online';
}
 $('profSetBtn').onclick = ()=>{
  const p = $('profSet');
  p.hidden = !p.hidden;
  if(!p.hidden){
    $('dispIn').value = dispOf(me);
    const c = nameColor(me);
    $('colorPick').value = /^#[0-9a-fA-F]{6}$/.test(c) ? c : '#8B7CF6';
  }
};
 $('dispSave').onclick = ()=>{
  const d = $('dispIn').value.trim();
  if(!d) return toast('Type a name first.','bad');
  if(d.length < 2 || d.length > 24) return toast('Name: 2–24 characters.','bad');
  update(ref(db, `users/${me}`), {display:d})
    .then(()=>toast('Name updated for everyone.','ok'))
    .catch(e=>toast("Couldn't save name — "+(e.message||'check DB rules.'),'bad'));
};
function setColor(hex){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex)) return;
  update(ref(db, `users/${me}`), {color:hex})
    .then(()=>toast('Name color updated.','ok'))
    .catch(e=>toast("Couldn't save color — "+(e.message||'check DB rules.'),'bad'));
}
document.querySelectorAll('.swatch').forEach(s=>s.onclick = ()=>setColor(s.dataset.c));
 $('colorPick').addEventListener('change', e=>setColor(e.target.value));

function pickAvatar(){ if(me) $('avatarFile').click(); }
 $('meAva').onclick = pickAvatar;
 $('avatarBtn').onclick = pickAvatar;
 $('avatarFile').addEventListener('change', e=>{
  const f = e.target.files[0]; e.target.value = '';
  if(!f || !me) return;
  if(!/^image\//.test(f.type||'')) return toast('Pick an image file.','bad');
  if(f.size > MAX_AVATAR) return toast(`Avatar too big — 8 MB max (this one: ${fmtSize(f.size)}).`,'bad');
  const safe = f.name.replace(/[^\w.\- ]+/g,'_');
  const task = uploadBytesResumable(sref(storage, `avatars/${me}/${Date.now()}_${safe}`), f, {contentType: f.type});
  toast('Uploading avatar…');
  task.on('state_changed', null,
    err=>toast(`Avatar upload failed (${err.code||'error'}) — Storage rules must allow read/write.`,'bad'),
    async ()=>{
      try{
        const url = await getDownloadURL(task.snapshot.ref);
        await update(ref(db,`users/${me}`), {avatar:url});
        toast('Avatar updated.','ok');
      }catch(e){ toast("Couldn't save avatar — "+(e.message||''),'bad'); }
    });
});
 $('avatarDel').onclick = ()=>{
  update(ref(db, `users/${me}`), {avatar:null})
    .then(()=>toast('Avatar removed.','ok'))
    .catch(()=>toast("Couldn't remove avatar.",'bad'));
};

/* ================= MODALS + SETTINGS ================= */
function openModal(html){ $('modalBox').innerHTML = html; $('modalWrap').hidden = false; }
function closeModal(){
  if(pwResolve){ const r = pwResolve; pwResolve = null; r(null); }
  $('modalWrap').hidden = true; $('modalBox').innerHTML = '';
}
 $('modalWrap').addEventListener('click', e=>{ if(e.target === $('modalWrap')) closeModal(); });
 $('modalBox').addEventListener('keydown', e=>{
  if(e.key !== 'Enter') return;
  if($('mGo')) $('mGo').click();
  else if($('mPwGo')) $('mPwGo').click();
  else if($('memGo')) $('memGo').click();
  else if($('joinGo')) $('joinGo').click();
});
 $('modalBox').addEventListener('click', async e=>{
  if(e.target.closest('[data-close]')) return closeModal();
  const pw = e.target.closest('#mPwGo');
  if(pw){
    const r = pwResolve; pwResolve = null;
    const v = $('mPwIn').value; closeModal(); if(r) r(v);
    return;
  }
  const mg = e.target.closest('#memGo');
  if(mg){
    const sid = mg.dataset.sid;
    const u = ($('memIn').value||'').trim().toLowerCase();
    if(!u) return toast('Type a username first.','bad');
    await addMember(sid, u);
    const inp = $('memIn'); if(inp){ inp.value = ''; inp.focus(); }
    return;
  }
  const um = e.target.closest('[data-unmem]');
  if(um){ await removeMember(um.dataset.sid, um.dataset.unmem); return; }
  const th = e.target.closest('[data-theme-set]');
  if(th){ setTheme(th.dataset.themeSet); markSettings(); return; }
  const fx = e.target.closest('[data-fx]');
  if(fx){ setVanta(fx.dataset.fx); markSettings(); return; }
  const jr = e.target.closest('[data-join]');
  if(jr){ joinServer(jr.dataset.join); return; }
  const jg = e.target.closest('#joinGo');
  if(jg){
    const id = ($('joinId').value||'').trim();
    if(!id) return toast('Paste a server ID first.','bad');
    await joinServer(id);
    return;
  }
  const go = e.target.closest('#mGo'); if(!go) return;
  const name = ($('mName').value || '').trim().replace(/^#/,'');
  if(!name) return toast('Give it a name.','bad');
  const pwv = ($('mPw') && $('mPw').value) || '';
  const hidden = !!($('mHidden') && $('mHidden').checked);
  go.disabled = true;
  (async ()=>{
    try{
      const sid = push(ref(db,'servers')).key;
      const sObj = {name, owner:me, createdAt:Date.now()};
      if(pwv) sObj.locked = true;
      if(hidden) sObj.hidden = true;
      await set(ref(db,`servers/${sid}`), sObj);
      if(pwv) await set(ref(db,`roomPasswords/${sid}`), {h: await sha256hex('server:'+pwv), set:Date.now()});
      if(hidden) toast(`Server created — ID: ${sid} (or add people from the sidebar).`,'ok');
      else toast('Server created.','ok');
      closeModal(); selectServer(sid, true);
    }catch(err){ toast((err && err.message) || 'Failed.','bad'); go.disabled = false; }
  })();
});
 $('addServerBtn').onclick = ()=>{
  openModal(`<h3>New server</h3>
    <p class="sub">Make your own space.</p>
    <label>server name<input id="mName" maxlength="24" placeholder="movie night" spellcheck="false"></label>
    <label>passcode <span class="opt">(optional)</span><input id="mPw" type="password" autocomplete="new-password"></label>
    <label class="chk"><input type="checkbox" id="mHidden"> hidden — invite people or share the ID</label>
    <div class="m-actions"><button class="btn" data-close>Cancel</button><button class="btn acc" id="mGo">Create server</button></div>`);
  setTimeout(()=>$('mName')?.focus(), 50);
};
 $('settingsBtn').onclick = ()=>{
  openModal(`<h3>Settings</h3>
    <label>theme</label>
    <div class="seg">
      <button class="seg-b" data-theme-set="dark">Dark</button>
      <button class="seg-b" data-theme-set="light">Light</button>
      <button class="seg-b dis" data-theme-set="discord">Discord</button>
    </div>
    <label>chat background</label>
    <div class="fx-grid">${Object.entries(VANTA_FX).map(([k,v])=>`<button class="fx-b" data-fx="${k}">${v.label}</button>`).join('')}</div>
    <p class="sub mono" style="margin-top:16px">relay v${VERSION}</p>
    <div class="m-actions"><button class="btn acc" data-close>Done</button></div>`);
  markSettings();
};
function markSettings(){
  document.querySelectorAll('.seg-b').forEach(b=>b.classList.toggle('active', b.dataset.themeSet===curTheme));
  document.querySelectorAll('.fx-b').forEach(b=>b.classList.toggle('active', b.dataset.fx===vantaKey));
}

/* ================= GIPHY ================= */
function openGif(){
  if(!curPath) return toast('Open a server first.','bad');
  if(chatLocked()) return toast('Chat is locked by the owner.','bad');
  $('gifWrap').hidden = false; loadGifs('');
}
function closeGif(){ $('gifWrap').hidden = true; $('gifSearch').value = ''; }
 $('gifBtn').onclick = openGif;
 $('gifClose').onclick = closeGif;
 $('gifWrap').addEventListener('click', e=>{ if(e.target === $('gifWrap')) closeGif(); });
async function loadGifs(q){
  $('gifGrid').innerHTML = '<div class="empty">loading…</div>';
  try{
    const url = q
      ? `https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(q)}&limit=30&rating=pg-13`
      : `https://api.giphy.com/v1/gifs/trending?api_key=${GIPHY_KEY}&limit=30&rating=pg-13`;
    const j = await (await fetch(url)).json();
    const data = (j.data || []).map(g => ({url:g.images.fixed_height.url, w:g.images.fixed_height.width, h:g.images.fixed_height.height}));
    $('gifGrid').innerHTML = data.length
      ? data.map(g=>`<button class="gcell" data-url="${esc(g.url)}" data-w="${g.w}" data-h="${g.h}"><img src="${esc(g.url)}" alt="gif" loading="lazy"></button>`).join('')
      : '<div class="empty">Nothing found.</div>';
  }catch{
    $('gifGrid').innerHTML = '<div class="empty">GIPHY unreachable — check key / network.</div>';
  }
}
let gifDeb;
 $('gifSearch').addEventListener('input', ()=>{ clearTimeout(gifDeb); gifDeb = setTimeout(()=>loadGifs($('gifSearch').value.trim()), 350); });
 $('gifSearch').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); clearTimeout(gifDeb); loadGifs($('gifSearch').value.trim()); } });
 $('gifGrid').addEventListener('click', e=>{
  const c = e.target.closest('.gcell'); if(!c || !curPath) return;
  if(chatLocked()) return toast('Chat is locked by the owner.','bad');
  const err = spamCheck(c.dataset.url);
  if(err) return toast(err,'bad');
  markSent(c.dataset.url);
  push(ref(db,curPath), {u:me, t:Date.now(), type:'gif', url:c.dataset.url, w:+c.dataset.w||200, h:+c.dataset.h||200})
    .catch(()=>toast("Couldn't send that GIF.",'bad'));
  closeGif();
});

function curMemSid(){
  const b = document.querySelector('#memGo');
  return b ? b.dataset.sid : null;
}

/* ================= MISC BINDINGS ================= */
 $('logoutBtn').onclick = async ()=>{
  try{
    if(serverPres) await remove(serverPres);
    await update(ref(db,`users/${me}`), {sessToken:null});
    await update(ref(db,`presence/${me}`), {online:false, lastSeen:Date.now()});
  }catch{}
  localStorage.removeItem('relay_session');
  location.reload();
};
 $('kickReload').onclick = ()=> location.reload();
document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if(!$('gifWrap').hidden) closeGif();
  else if(!$('modalWrap').hidden) closeModal();
  else if(editingKey) cancelEdit();
  else if(replyingTo) cancelReply();
});

/* ================= BOOT ================= */
document.querySelectorAll('[data-icon]').forEach(el=>{ el.insertAdjacentHTML('afterbegin', I[el.dataset.icon] || ''); });
 $('loginVer').textContent = 'v'+VERSION;
(async function boot(){
  // invisible anonymous sign-in FIRST — this is what lets the database rules tell
  // your page apart from strangers opening the database URL directly.
  try{ await signInAnonymously(auth); }
  catch(e){ console.warn('anonymous sign-in failed — enable Anonymous in the Firebase console', e); }

  // ---- global listeners (attach only after sign-in) ----
  onValue(ref(db,'servers'), s=>{
    serversMap = s.val()||{};
    if(me){ renderServers(); applyLockState(); }
  });
  onValue(ref(db,'users'), s=>{
    usersMap = s.val()||{};
    const lu = $('loginUsers'); if(lu) lu.textContent = Object.keys(usersMap).length;
    if(me){
      if(!usersMap[me]) return forceLogout('Account deleted', 'your account was removed by an admin');
      renderMeChip(); refreshMsgStyles();
    }
  });
  onValue(ref(db,'presence'), s=>{
    presenceMap = s.val()||{};
    if(me){
      renderOnline(); updateOnlinePill(); renderDMs();
      if(!$('modalWrap').hidden && $('memList')) renderMemList(curMemSid());
    }
  });
  onValue(ref(db,'config/bannedUsers'), s=>{
    bannedUsers = s.val()||{};
    if(me && bannedUsers[me]) return forceLogout('Account banned', reasonOf(bannedUsers[me]));
  });
  onValue(ref(db,'config/bannedIps'), s=>{
    bannedIps = s.val()||{};
    if(me && myIp && bannedIps[ipKey(myIp)]) return forceLogout("You're blocked", `your IP ${myIp} was banned`);
  });
  // ----

  await tryAutoLogin();
})();
</script>
