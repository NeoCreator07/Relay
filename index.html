		<script>
			let metrics = {};
			const observer = new PerformanceObserver((list) => {
				const entries = list.getEntries();

				entries.forEach((entry) => {
					// 根据不同的entry类型处理不同的性能指标
					switch (entry.entryType) {
						case 'navigation':
							{
								const navEntry = entry;
								metrics = {
									...metrics,
									dns: navEntry.domainLookupEnd - navEntry.domainLookupStart,
									response: navEntry.responseEnd - navEntry.responseStart,
									dom_parse: navEntry.domInteractive - navEntry.responseEnd,
									dom_ready: navEntry.domContentLoadedEventEnd - navEntry.fetchStart,
									resource: navEntry.domComplete - navEntry.domContentLoadedEventEnd,
									first_interactive: navEntry.domInteractive - navEntry.fetchStart,
									first_byte: navEntry.responseStart - navEntry.domainLookupStart,
									loaded: navEntry.loadEventEnd - navEntry.fetchStart
								};
								sessionStorage.setItem('performance', JSON.stringify(metrics));
								// 发送性能指标到阿里云日志服务
							}
							break;

						case 'paint':
							if (entry.name === 'first-paint') {
								metrics = {
									...metrics,
									first_paint: entry.startTime
								};
								sessionStorage.setItem('performance', JSON.stringify(metrics));
							}
							if (entry.name === 'first-contentful-paint') {
								metrics = {
									...metrics,
									first_contentful_paint: entry.startTime
								};
								sessionStorage.setItem('performance', JSON.stringify(metrics));
							}
							break;
					}
				});
			});

			// 观察的性能指标类型
			observer.observe({
				entryTypes: ['navigation', 'paint']
			});
		</script>

				&lt;script&gt;
					var Z_CDN_WHITELIST = [
						'cdn.jsdelivr.net',
						'cdnjs.cloudflare.com',
						'cdn.tailwindcss.com',
						'unpkg.com',
						'fonts.googleapis.com',
						'd3js.org',
						'cdn.babylonjs.com',

					];

					function z_isUrlInWhitelist(url) {
						if (!url || typeof url !== 'string') {
							return false;
						}
						try {
							const urlObj = new URL(url);
							const hostname = urlObj.hostname;
							return Z_CDN_WHITELIST.some(domain =&gt; hostname === domain);
						} catch (e) {
							return false;
						}
					}

						function z_proxyCdnUrl(url) {
						if (!url || !url.startsWith('http')) {
							return url;
						}
							if (!z_isUrlInWhitelist(url)) {
							return url;
						}
						if (!url.startsWith('https://artifacts-cdn.chatglm.site/')) {
							return 'https://artifacts-cdn.chatglm.site/' + url;
						}
						return url;
					}
					
					// 增强版外部链接拦截 - 适合放在模板字符串中
					document.addEventListener('click', function (ev) {
						try {
							const anchor = ev.target?.closest?.('a[href]') || null;
							if (!anchor) return;

							let href = anchor.getAttribute('href')?.trim() || '';
							if (!href) return;

							if (href.startsWith('javascript:')) return;

							// 新需求：href=&quot;#&quot; 的链接完全阻止跳转和任何行为
							if (href === '#') {
								ev.preventDefault();
								return;
							}

							// 处理其他内部锚点（如 #about、#contact 等）
							if (href.startsWith('#')) {
								const rawId = href.slice(1);
								if (!rawId) return;

								const id = decodeURIComponent(rawId);
								const target = 
									document.getElementById(id) ||
									document.querySelector('a[name=&quot;' + id.replace(/&quot;/g, '\&quot;') + '&quot;]') ||
									document.querySelector('[name=&quot;' + id.replace(/&quot;/g, '\&quot;') + '&quot;]');

								if (target &amp;&amp; target.scrollIntoView) {
									ev.preventDefault();
									try {
										history.pushState(null, '', href);
									} catch (e) {}
									target.scrollIntoView({ behavior: 'smooth', block: 'start' });
								}
								return;
							}

							// 处理外部链接
							let url;
							try {
								url = new URL(href, window.location.href);
							} catch (e) {
								return;
							}

							if (url.protocol !== 'http:' &amp;&amp; url.protocol !== 'https:') return;

							const isExternal = url.hostname !== window.location.hostname;

							if (isExternal || anchor.getAttribute('target') === '_blank') {
								ev.preventDefault();
								window.open(url.toString(), '_blank', 'noopener,noreferrer');
							}

						} catch (e) {
							// 出错时不阻止默认行为
						}
					}, true);

					// 1. 暴力清除函数：从 DOM 层面抹除 onclick 属性
					var Z_removeInlineOnclick = function () {
						// 专门锁定 href=&quot;#&quot; 且带有 onclick 的 a 标签

						for (let i = 0; i &lt; targetedLinks.length; i++) {
							targetedLinks[i].removeAttribute('onclick');
							targetedLinks[i].onclick = null; // 确保 JS 层的赋值也被清理
						}
					};
					// 3. 动态监测：防止页面通过异步加载重新生成带 onclick 的元素

						Z_removeInlineOnclick();
					});

					z_observer.observe(document.documentElement, {
						childList: true,
						subtree: true,
						attributes: true,
						attributeFilter: ['onclick']

					// 4. 初始化执行一次
					Z_removeInlineOnclick();

					const Z_rawCreateElement = document.createElement;

					document.createElement = function (tagName, ...args) {

									} else {

									}
								},
								configurable: true,
								enumerable: true
							});
						}

						if (tagName.toLowerCase() === 'link') {
							const rawSetAttribute = el.setAttribute;
							const rawGetAttribute = el.getAttribute;
							let hrefValue = '';
							
							el.setAttribute = function (name, value) {
								if (name === 'href' &amp;&amp; typeof value === 'string') {
									value = z_proxyCdnUrl(value);
									hrefValue = value;
								}
								return rawSetAttribute.call(this, name, value);
							};

							Object.defineProperty(el, 'href', {
								get: function() {
									return hrefValue || rawGetAttribute.call(this, 'href') || '';
								},
								set: function(value) {
									if (typeof value === 'string') {
										hrefValue = z_proxyCdnUrl(value);
										rawSetAttribute.call(this, 'href', hrefValue);
									} else {
										hrefValue = value;
									}

								configurable: true,
								enumerable: true
							});

						return el;
					};

					const Z_OriginalXMLHttpRequest = window.XMLHttpRequest;

					};

					Object.setPrototypeOf(window.XMLHttpRequest, Z_OriginalXMLHttpRequest);

					const z_originalFetch = window.fetch;
					window.fetch = async function (...args) {

								if (args[1] &amp;&amp; args[1].method) {

&lt;style&gt;
:root{
  --bg:#101014; --panel:#17171D; --panel2:#1E1E26; --panel3:#24242E;
  --line:#2A2A34; --line2:#383844;
  --text:#ECECF1; --muted:#9494A3; --faint:#62626F;
  --acc:#8B7CF6; --acc-ink:#191225; --acc-hi:#9C90F8;
  --bad:#F06D6D; --ok:#5AD18C;
  --card:rgba(23,23,29,.78);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Nunito',system-ui,sans-serif;
}
html[data-theme=light]{
  --bg:#F6F6FA; --panel:#FFFFFF; --panel2:#EFEFF5; --panel3:#E7E7F0;
  --line:#E1E1EA; --line2:#D0D0DC;
  --text:#23232B; --muted:#6E6E7C; --faint:#A0A0AE;
  --acc:#6C5CE7; --acc-ink:#FFFFFF; --acc-hi:#7D6EF0;
  --bad:#E35D5D; --ok:#3EA86B;
  --card:rgba(255,255,255,.82);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--acc);color:var(--acc-ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid var(--panel)}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
input:focus{border-color:var(--acc)}
input::placeholder{color:var(--faint)}
a{color:var(--acc);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}

/* ---------- background (fixed, behind everything) ---------- */
#vantaBg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-weight:700;font-size:12.5px;color:var(--text);transition:border-color .15s,background .15s,color .15s}
.btn:hover{border-color:var(--muted)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.acc:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.btn.danger{border-color:rgba(240,109,109,.4);color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);background:rgba(240,109,109,.08)}
.btn.armed{border-color:var(--bad);color:var(--bad);background:rgba(240,109,109,.12);animation:armedPulse 1s infinite}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:13px;height:13px}
@keyframes armedPulse{50%{background:rgba(240,109,109,.24)}}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);background:var(--panel2)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.ok:hover{color:var(--ok)}
.icon-btn.no:hover{color:var(--bad)}

/* ---------- auth ---------- */
.auth{display:grid;grid-template-columns:1.05fr .95fr;height:100vh}
.auth-brand{background:var(--panel);border-right:1px solid var(--line);display:grid;place-items:center}
.auth-brand-inner{width:min(420px,82%)}
.logo-lg{display:flex;align-items:center;gap:14px}
.logo-lg .mark svg{width:46px;height:46px;color:var(--acc);display:block}
.logo-lg .word{font-weight:800;font-size:32px}
.auth-form-wrap{display:grid;place-items:center;padding:24px;background:var(--bg)}
.auth-form{width:min(380px,100%);background:var(--card);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 10px 36px rgba(0,0,0,.28)}
.auth-form h1{font-size:24px;font-weight:800}
.auth-form .sub{margin-top:6px;color:var(--muted);font-size:13px}
.auth-meta{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em}
.auth-meta b{color:var(--muted);font-weight:500}
.auth-form label{display:block;margin-top:20px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.auth-form label input{margin-top:8px}
.err{margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--bad);min-height:18px;line-height:1.5}
.auth-form .btn.acc{width:100%;margin-top:10px;justify-content:center;padding:11px;font-size:14px}
.auth-switch{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}

/* ---------- app frame ---------- */
.app{height:100vh}
.side{position:fixed;top:0;left:0;bottom:0;width:262px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;z-index:110;transform:translateX(-102%);transition:transform .25s cubic-bezier(.22,.85,.25,1)}
body.side-open .side{transform:none}
.logo-row{display:flex;align-items:center;flex:none}
.logo-row .logo-btn{flex:1}
.logo-row&gt;.icon-btn{margin-right:8px}
.logo-btn{display:flex;align-items:center;gap:10px;padding:16px 12px 13px;user-select:none;cursor:pointer;position:relative;min-height:48px}
.logo-btn .mark svg{width:20px;height:20px;color:var(--muted);display:block;transition:color .15s}
.logo-btn:hover .mark svg{color:var(--acc)}
.logo-btn .word{font-weight:800;font-size:17px}
.svc-line{position:absolute;left:44px;bottom:1px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--acc);white-space:nowrap}
.svc-line.ok{color:var(--ok)} .svc-line.bad{color:var(--bad)}
.logo-btn.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
/* inset divider lines (discord-style — stop short of the edges) */
.ins-div{height:1px;background:var(--line);margin:0 14px;flex:none}
.side-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.side-foot{flex:none}
.side-foot::before{content:'';display:block;height:1px;background:var(--line);margin:0 14px}
.me-chip{display:flex;align-items:center;gap:10px;padding:10px 14px}
.ava{display:grid;place-items:center;border-radius:8px;font-weight:800;color:#1B1B22;user-select:none;flex:none;overflow:hidden;position:relative}
.ava img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;position:absolute;inset:0}
.me-chip .ava{width:32px;height:32px;font-size:14px;cursor:pointer}
.me-chip .ava:hover{outline:2px solid var(--acc)}
.me-chip .who{min-width:0;flex:1}
.me-chip .who b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-chip .who b svg{width:11px;height:11px;color:var(--acc);margin-left:4px;vertical-align:-1px}
.me-chip .who span{font-size:9.5px;letter-spacing:.12em;color:var(--ok);text-transform:uppercase}
/* profile settings (opens under the card) */
.prof-set{padding:2px 14px 12px}
.prof-set::before{content:'';display:block;height:1px;background:var(--line);margin:0 0 10px}
.ps-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ps-row+.ps-row{margin-top:10px}
.color-lbl{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-right:2px}
.swatch{width:20px;height:20px;border-radius:6px;border:1px solid rgba(0,0,0,.35);cursor:pointer;flex:none}
.swatch:hover{transform:scale(1.15)}
input[type=color]{width:28px;height:21px;padding:0;border:1px solid var(--line2);border-radius:6px;background:none;cursor:pointer}
.sec{padding:12px 10px 14px}
.sec+.sec::before{content:'';display:block;height:1px;background:var(--line);margin:0 14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px}
.sec-h span.t{font-size:9.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:700}
.sec-h .btns{display:flex;gap:2px}
.sec-h .icon-btn{width:22px;height:22px}
.sec-h .icon-btn svg{width:13px;height:13px}
.side-list{list-style:none}
.side-list li{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;color:var(--muted);cursor:pointer;font-size:13.5px;margin-bottom:1px}
.side-list li:hover{background:var(--panel2);color:var(--text)}
.side-list li.active{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--acc)}
.side-list .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.side-list li svg{width:13px;height:13px;flex:none;opacity:.55}
.side-list .sub{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--acc);letter-spacing:.1em}
.side-list .hid{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--faint);letter-spacing:.1em}
.side-list .lk{display:inline-flex;flex:none;color:var(--muted)}
.side-list .lk svg{width:11px;height:11px;opacity:1}
/* invite button on hidden servers you own (appears on hover, badge slides away) */
.side-list .li-act{display:none;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;color:var(--muted);flex:none}
.side-list li:hover .li-act{display:inline-flex}
.side-list .li-act:hover{color:var(--acc)}
.side-list .li-act svg{width:12px;height:12px;opacity:1}
.side-list li:hover .hid{display:none}
.side-list .ip2{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--faint)}
.rdot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.pdot.on{background:var(--ok)}
.fr-acts{margin-left:auto;display:flex;gap:2px}
.fr-acts .icon-btn{width:22px;height:22px}
.fr-acts .icon-btn svg{width:12px;height:12px}
.add-row{display:flex;gap:6px;padding:0 4px 8px}
.add-row input{padding:6px 8px;font-size:12.5px}
.add-row .btn{padding:6px 9px}
.empty{font-size:11.5px;color:var(--faint);padding:10px 12px;border:1px dashed var(--line);border-radius:8px;line-height:1.6}

/* ---------- main: floating chat card ---------- */
.main{position:relative;z-index:1;height:calc(100vh - 24px);margin:12px;background:var(--card);backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-width:0;overflow:hidden;box-shadow:0 10px 36px rgba(0,0,0,.28);transition:margin-left .25s cubic-bezier(.22,.85,.25,1)}
body.side-open .main{margin-left:274px}
.chat-head{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.chat-head h2{font-size:15.5px;font-weight:800}
.chat-head h2 .hash{color:var(--acc);font-weight:700;margin-right:2px}
.chat-head .meta{font-size:10.5px;color:var(--muted);letter-spacing:.06em;margin-top:3px}
.chat-head .right{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.chat-head .right b{color:var(--ok);font-weight:500}
.msgs{flex:1;overflow-y:auto;padding:16px 16px 12px}
.msg{display:flex;gap:11px;padding:6px 8px;border-radius:10px;margin-bottom:2px;position:relative}
.msg:hover{background:rgba(128,128,128,.06)}
.msg .ava{width:30px;height:30px;font-size:12px;margin-top:2px}
.msg .mc{min-width:0}
.msg .mh{display:flex;align-items:baseline;gap:9px}
.msg .mh .name{font-size:13px;font-weight:700}
.msg .mh .time{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.msg .text{font-size:13.8px;line-height:1.55;margin-top:1px;overflow-wrap:break-word;white-space:pre-wrap}
.msg img.gif{display:block;margin-top:6px;max-width:min(360px,100%);height:auto;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
/* day dividers (timestamps) */
.day-div{display:flex;align-items:center;gap:12px;margin:16px 0 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.day-div::before,.day-div::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- hover toolbar: reactions + reply ---------- */
.hover-bar{position:absolute;right:10px;top:-15px;display:none;align-items:center;gap:2px;background:var(--panel3);border:1px solid var(--line2);border-radius:10px;padding:3px;box-shadow:0 4px 16px rgba(0,0,0,.35);z-index:3}
.msg:hover .hover-bar{display:flex}
.hover-bar button{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:7px;font-size:13px;color:var(--muted);transition:.12s}
.hover-bar button:hover{background:var(--panel2);color:var(--text);transform:scale(1.12)}
.hover-bar .hb-reply svg{width:13px;height:13px}
/* reaction chips */
.reactions{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.react{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:2px 8px 2px 7px;font-size:12.5px;cursor:pointer}
.react b{font-size:10.5px;color:var(--muted);font-family:var(--mono);font-weight:600}
.react:hover{border-color:var(--muted)}
.react.mine{border-color:var(--acc);background:rgba(139,124,246,.14)}
.react.mine b{color:var(--acc)}
/* reply quote on a message */
.reply-quote{display:flex;align-items:center;gap:6px;margin:1px 0 3px;padding-left:8px;border-left:2px solid var(--acc);color:var(--muted);font-size:11.5px;cursor:pointer;min-width:0;max-width:100%}
.reply-quote:hover{color:var(--text)}
.reply-quote .rq-ic{display:inline-flex;flex:none;color:var(--acc)} .reply-quote .rq-ic svg{width:12px;height:12px}
.reply-quote b{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.reply-quote .rq-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.msg.flash{animation:msgFlash 1.6s}
@keyframes msgFlash{0%,55%{background:rgba(139,124,246,.2)}100%{background:transparent}}

/* ---------- reply bar above composer ---------- */
.replybar{flex:none;margin:0 14px 8px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:7px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);overflow:hidden}
.replybar .rb-ic{display:inline-flex;flex:none;color:var(--acc)} .replybar .rb-ic svg{width:13px;height:13px}
.replybar .rb-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.replybar .rb-x{margin-left:auto;flex:none;display:inline-flex;cursor:pointer;color:var(--muted)}
.replybar .rb-x svg{width:14px;height:14px}
.replybar .rb-x:hover{color:var(--bad)}

/* ---------- uploads / embeds ---------- */
.upbar{flex:none;margin:0 14px 8px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:8px 12px}
.up-info{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-bottom:6px;gap:10px}
.up-info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-x{color:var(--muted)} .up-x svg{width:12px;height:12px}
.up-track{height:4px;border-radius:4px;background:var(--panel3);overflow:hidden}
.up-fill{height:100%;width:0;background:var(--acc);transition:width .2s}
.file-card{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;margin-top:6px;max-width:100%;text-decoration:none;color:var(--text)}
.file-card:hover{border-color:var(--acc);text-decoration:none}
.fic{color:var(--acc);display:inline-flex} .fic svg{width:18px;height:18px}
.fc-b{min-width:0;display:flex;flex-direction:column}
.fc-b b{font-size:12.5px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-b i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:2px}
.dl{color:var(--muted)} .dl svg{width:15px;height:15px}
.embed{margin-top:6px;max-width:380px}
.embed-img{display:block;max-width:min(380px,100%);max-height:380px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.embed-vid{display:block;width:100%;max-width:380px;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;background:#000}
.embed-sm{display:block;width:100%;max-width:380px;height:152px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.embed-card{display:flex;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);text-decoration:none;color:var(--text);align-items:center}
.embed-card:hover{border-color:var(--acc);text-decoration:none}
.embed-card img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:none}
.ec-t{min-width:0;display:flex;flex-direction:column;gap:3px}
.ec-t b{font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ec-t span{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* ---------- composer pill (no send button — Enter sends, Shift+Enter = newline) ---------- */
.composer{flex:none;display:flex;align-items:flex-end;gap:6px;margin:0 14px 14px;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:7px}
.composer textarea{flex:1;min-width:0;background:none;border:none;outline:none;resize:none;padding:9px 6px;font:inherit;font-family:var(--sans);color:var(--text);line-height:1.45;max-height:160px;overflow-y:auto}
.composer textarea::placeholder{color:var(--faint)}
.cp-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;color:var(--muted);transition:.15s;margin-bottom:1px}
.cp-btn:hover{color:var(--acc);background:var(--panel3)}
.cp-btn svg{width:16px;height:16px}
.cp-gif{width:auto;padding:0 10px;font-weight:800;font-size:10.5px;letter-spacing:.08em}

/* ---------- admin drawer (floating) ---------- */
.drawer-wrap{position:fixed;inset:0;z-index:140}
.drawer-ovl{position:absolute;inset:0;background:rgba(8,8,12,.6)}
.drawer{position:absolute;top:12px;right:12px;bottom:12px;width:min(750px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line2);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 24px));transition:transform .3s cubic-bezier(.22,.85,.25,1);box-shadow:0 10px 36px rgba(0,0,0,.35)}
.drawer.open{transform:none}
.drawer-head{padding:16px 20px 0;border-bottom:1px solid var(--line);flex:none}
.drawer-title{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--acc)}
.drawer-title svg{width:14px;height:14px}
.drawer-title .who{margin-left:auto;color:var(--faint);letter-spacing:.06em;font-size:10px}
.drawer-tabs{display:flex;gap:2px;margin-top:14px}
.drawer-tabs button{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:9px 13px;border-bottom:2px solid transparent;margin-bottom:-1px}
.drawer-tabs button:hover{color:var(--text)}
.drawer-tabs button.active{color:var(--acc);border-color:var(--acc)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px 30px}
.pane h4{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;font-weight:700}
.pane h4:first-child{margin-top:0}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--panel2)}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;color:var(--acc)}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.mini-row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding:9px 2px;font-size:13px}
.mini-row span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.adm-row{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;background:var(--panel2)}
.adm-row .info{min-width:0;flex:1}
.adm-row .info b{font-size:14px}
.adm-row .sub{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:4px;letter-spacing:.03em}
.adm-row .acts{display:flex;gap:7px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.lookup-row{display:flex;gap:8px}
.lookup-row input{max-width:220px;font-family:var(--mono)}
.ban-form{display:flex;gap:8px;flex-wrap:wrap}
.ban-form input{padding:8px 10px;font-size:12px}
.ban-form .ipw{font-family:var(--mono);width:170px;flex:none}
.ip-user{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:var(--panel2)}
.ip-user .h{display:flex;align-items:baseline;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.ip-user .h b{font-size:13.5px}
.ip-user .h span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:999px;padding:3.5px 6px 3.5px 11px;font-family:var(--mono);font-size:11.5px;color:var(--text);cursor:copy}
.chip:hover{border-color:var(--muted)}
.chip.cur{border-color:var(--acc)}
.chip.plain{cursor:default}
.chip .cnt{color:var(--faint);font-size:9.5px;font-style:normal}
.chip button{font-family:var(--mono);font-size:9px;letter-spacing:.08em;border-radius:999px;padding:2px 8px;color:var(--bad);border:1px solid rgba(240,109,109,.35);cursor:pointer;background:none}
.chip button:hover{background:rgba(240,109,109,.12)}
.chip button.armed{background:var(--bad);color:#160B08}
.ucard{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:16px}
.uc-head{display:flex;align-items:center;gap:12px}
.uc-head .ava{width:36px;height:36px;font-size:15px}
.uc-head b{font-size:16px}
.uc-head .st{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-top:2px}
.tagb{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--bad);border:1px solid rgba(240,109,109,.4);border-radius:5px;padding:2px 7px;letter-spacing:.1em}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:16px 0 8px}
.u-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.u-meta&gt;div{border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.u-meta i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.u-meta b{font-family:var(--mono);font-size:12px;font-weight:500}
.uc-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.uc-acts input{flex:1;min-width:150px;padding:7px 10px;font-size:12px}

/* ---------- members modal (hidden server invites) ---------- */
.mem-list{margin-top:14px;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.mem-row{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel2)}
.mem-row .ava{width:24px;height:24px;font-size:11px}
.mem-row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.mem-row b svg{width:11px;height:11px;color:var(--acc);margin-left:4px;vertical-align:-1px}
.mem-st{font-family:var(--mono);font-size:9.5px;color:var(--faint);flex:none}
.mem-tag{font-family:var(--mono);font-size:8.5px;color:var(--acc);letter-spacing:.12em;flex:none}
.mem-row .icon-btn{width:22px;height:22px}
.mem-row .icon-btn svg{width:12px;height:12px}

/* ---------- settings modal ---------- */
.seg{display:flex;gap:6px}
.seg-b{flex:1;border:1px solid var(--line2);border-radius:8px;padding:8px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg-b.active{border-color:var(--acc);color:var(--acc);background:rgba(139,124,246,.1)}
.fx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.fx-b{border:1px solid var(--line2);border-radius:8px;padding:8px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fx-b.active{border-color:var(--acc);color:var(--acc);background:rgba(139,124,246,.1)}

/* ---------- toasts / modals / kick ---------- */
#toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:9px;padding:10px 14px;font-size:13px;max-width:340px;animation:tin .22s cubic-bezier(.2,.9,.3,1.15);cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.bad{border-left-color:var(--bad)}
.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
.toast.out{opacity:0;transform:translateX(20px);transition:.25s}
.modal-wrap{position:fixed;inset:0;z-index:150;display:grid;place-items:center;background:rgba(8,8,12,.7)}
.modal{width:min(430px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:20px;animation:pop .16s ease-out;box-shadow:0 10px 36px rgba(0,0,0,.35)}
@keyframes pop{from{transform:scale(.96) translateY(6px);opacity:0}}
.modal h3{font-size:16px;font-weight:800}
.modal .sub{color:var(--muted);font-size:12.5px;margin-top:5px}
.modal label{display:block;margin-top:14px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.modal label input{margin-top:7px}
.modal label .opt{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400}
.chk{display:flex;align-items:center;gap:9px;margin-top:14px;cursor:pointer;font-size:13px;color:var(--text);text-transform:none;letter-spacing:0;font-family:var(--sans)}
.chk input{width:15px;height:15px;accent-color:var(--acc);padding:0;flex:none}
.m-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.srv-results{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:250px;overflow-y:auto}
.srv-r{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;background:var(--panel2)}
.srv-r:hover{border-color:var(--acc)}
.srv-r b{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srv-r i{font-style:normal;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.05em;white-space:nowrap}
.srv-r .lk{color:var(--muted);display:inline-flex;flex:none}
.srv-r .lk svg{width:12px;height:12px}
.modal.gif{width:min(900px,94vw);height:min(660px,90vh);display:flex;flex-direction:column;padding:0;overflow:hidden}
.gif-head{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex:none}
.gif-head .lbl{margin:0;color:var(--acc);flex:none}
.gif-head input{flex:1;padding:8px 12px}
.gif-grid{flex:1;overflow-y:auto;padding:14px;column-width:172px;column-gap:11px}
.gcell{display:block;width:100%;break-inside:avoid;margin-bottom:11px;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:var(--panel2)}
.gcell img{display:block;width:100%;height:auto}
.gcell:hover{border-color:var(--acc)}
.gif-foot{flex:none;padding:9px 16px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--faint)}
.gif-foot a{color:var(--muted)}
.kick{position:fixed;inset:0;z-index:400;background:var(--bg);display:grid;place-items:center;padding:20px}
.kick .box{width:min(420px,100%);text-align:center}
.kick-ic svg{width:38px;height:38px;color:var(--bad)}
.kick h2{font-size:20px;margin-top:16px;font-weight:800}
.kick p{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.7}
.kick .btn{margin-top:22px}

/* ---------- responsive ---------- */
@media(max-width:880px){
  body.side-open .main{margin-left:12px}
  .side{width:280px;box-shadow:14px 0 40px rgba(0,0,0,.45)}
  .auth{grid-template-columns:1fr}
  .auth-brand{display:none}
}

// leet → letters, applied before matching, so &quot;sh1t&quot; / &quot;f@ck&quot; / &quot;b0llocks&quot; all get caught
const LEET = {'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','8':'b','@':'a','$':'s','!':'i','+':'t','€':'e','£':'l'};
const BAD_RAW = [
  'fuck','fucks','fucked','fucker','fuckers','fucking','motherfucker','motherfucking','mf',
  'shit','shits','shitty','bullshit','dipshit','shithead','shitstorm',
  'bitch','bitches','bitchy','bitchass',
  'ass','arse','asshole','arsehole','asshat','dumbass','jackass','badass','smartass','fatass',
  'bastard','bastards',
  'cunt','cunts',
  'dick','dicks','dickhead',
  'piss','pissed','pissing',
  'prick','pricks',
  'whore','whores','slut','sluts','slutty','skank','skanks',
  'douche','douches','douchebag',
  'twat','twats','wanker','wankers','bollocks',
  'cock','cocks','cocksucker','pussy',
  'fag','fags','faggot','faggots',
  'nigger','niggers','nigga','niggas',
  'retard','retards','retarded',
  'damn','damned','dammit','goddamn','goddammit','goddamnit',
  'crap','craps','crappy','jerkoff','tit','tits','titties'
];
function canonWord(w){
  let out = '';
  for(const ch of w.toLowerCase()){
    const c = /[a-z]/.test(ch) ? ch : LEET[ch];
    if(c) out += c;
  }
  return out.replace(/(.)\1+/g, '$1');   // collapse stretched letters: &quot;fuuuck&quot; → &quot;fuck&quot;
}
const BAD_WORDS = new Set(BAD_RAW.map(canonWord));
function censorWord(seg){
  const m = seg.match(/^(\W*)(.*?)(\W*)$/);
  const lead = m[1]||'', core = m[2]||'', trail = m[3]||'';
  if(core &amp;&amp; BAD_WORDS.has(canonWord(core))) return lead + '*'.repeat(core.length) + trail;
  return seg;
}
const censorText = t =&gt; t.replace(/\S+/g, censorWord);

/* ================= SPAM PROTECTION ================= */
let lastSentAt = 0, sentLog = [];   // {key, t} — key is the (censored) text or gif url
function spamCheck(key){
  const now = Date.now();
  if(now - lastSentAt &lt; MSG_COOLDOWN) return 'Easy — slow down a little.';
  sentLog = sentLog.filter(x =&gt; now - x.t &lt; DUP_WINDOW);
  const recent = sentLog.filter(x =&gt; now - x.t &lt; RATE_WINDOW);
  if(recent.length &gt;= RATE_MAX){
    const wait = Math.max(1, Math.ceil((RATE_WINDOW - (now - recent[0].t)) / 1000));
    return `Rate limit — take a breath (${wait}s).`;
  }
  if(sentLog.some(x =&gt; x.key === key)) return 'You already sent that.';
  return null;
}

/* ================= AUTH ================= */
async function assertNotBanned(u, user, ip){
  const [bIps,bUs] = await Promise.all([getV('config/bannedIps'), getV('config/bannedUsers')]);
  if(bUs &amp;&amp; bUs[u]) throw new Error(`This account is banned — ${reasonOf(bUs[u])}`);
  if(bIps &amp;&amp; ip &amp;&amp; bIps[ipKey(ip)]) throw new Error(`Your network (${ip}) is blocked from Relay.`);
  const linked = Object.values(user.ips||{}).find(v =&gt; v &amp;&amp; v.ip &amp;&amp; bIps &amp;&amp; bIps[ipKey(v.ip)]);
  if(linked) throw new Error(`This account was used from a banned IP (${linked.ip}).`);
}
async function doLogin(u, p, ip){
  const user = await getV(`users/${u}`);
  if(!user) throw new Error('No account with that username.');
  if(user.pw !== await sha256hex(user.salt+':'+p)) throw new Error('Wrong password.');
  await assertNotBanned(u, user, ip);
  const tok = crypto.randomUUID ? crypto.randomUUID() : randHex(24);
  await update(ref(db,`users/${u}`), {sessToken:tok, lastLogin:Date.now(), ip});
  await logUserIp(u, ip);
  localStorage.setItem('relay_session', JSON.stringify({u, tok}));
  await enter(u, ip);
}
async function doRegister(u, p, ip){
  const [exist,bIps,bUs] = await Promise.all([getV(`users/${u}`), getV('config/bannedIps'), getV('config/bannedUsers')]);
  if(exist) throw new Error('That username is taken.');
  if(bIps &amp;&amp; bIps[ipKey(ip)]) throw new Error(`Your network (${ip}) is blocked from Relay.`);
  if(bUs &amp;&amp; bUs[u]) throw new Error('That username is banned.');
  const salt = randHex(8), now = Date.now();
  const tok = crypto.randomUUID ? crypto.randomUUID() : randHex(24);
  const user = {
    salt, pw: await sha256hex(salt+':'+p), createdAt: now, lastLogin: now, ip,
    sessToken: tok,
    ips: { [ipKey(ip)]: {ip, first:now, last:now, count:1} }
  };
  // very first account becomes the admin (config/admins)
  let firstAdmin = false;
  try{
    const res = await runTransaction(ref(db,'config/admins'), c =&gt; c ? undefined : ({[u]:true}));
    firstAdmin = !!(res &amp;&amp; res.committed &amp;&amp; res.snapshot &amp;&amp; res.snapshot.val() &amp;&amp; res.snapshot.val()[u]);
  }catch{}
  await set(ref(db,`users/${u}`), user);
  // starter server so new users land somewhere
  const sid = push(ref(db,'servers')).key;
  await set(ref(db,`servers/${sid}`), {name:`${u}'s server`, owner:u, createdAt:now});
  localStorage.setItem('relay_session', JSON.stringify({u, tok}));
  if(firstAdmin) toast(&quot;First user — admin unlocked. Triple-click the logo and set an admin password.&quot;,'ok');
  await enter(u, ip);
}
async function tryAutoLogin(){
  let sess=null;
  try{ sess = JSON.parse(localStorage.getItem('relay_session')||'null'); }catch{}
  if(!sess || !sess.u) return false;
  const user = await getV(`users/${sess.u}`);
  if(!user || user.sessToken !== sess.tok){ localStorage.removeItem('relay_session'); return false; }
  const ip = await getPublicIp();
  try{ await assertNotBanned(sess.u, user, ip); }
  catch(err){ localStorage.removeItem('relay_session'); $('authErr').textContent = err.message; return false; }
  await update(ref(db,`users/${sess.u}`), {lastLogin:Date.now(), ip});
  await logUserIp(sess.u, ip);
  await enter(sess.u, ip);
  return true;
}
async function enter(u, ip){
  me = u; myIp = ip || await getPublicIp();
  $('authView').hidden = true; $('appView').hidden = false;
  renderMeChip(); resetChannel();
  // presence FIRST (whole-node set would wipe the servers sub-map written by selectServer)
  const pref = ref(db,`presence/${me}`);
  try{
    await onDisconnect(pref).set({online:false, lastSeen:Date.now(), ip:myIp});
    await update(pref, {online:true, lastSeen:Date.now(), ip:myIp});
  }catch{}
  setInterval(()=&gt;{ if(!kicked) update(pref,{lastSeen:Date.now()}).catch(()=&gt;{}); }, 45000);
  // joined / unlocked servers (hidden + passcode) — also fires when someone adds you
  onValue(ref(db,`userRooms/${me}`), s=&gt;{
    userRoomsMap = s.val()||{};
    renderServers();
    // removed from a hidden server by its owner? → leave it live
    const sv = cur.server &amp;&amp; serversMap[cur.server];
    if(cur.server &amp;&amp; sv &amp;&amp; sv.hidden &amp;&amp; sv.owner!==me &amp;&amp; !userRoomsMap[cur.server]){
      if(serverPres){ remove(serverPres).catch(()=&gt;{}); serverPres = null; }
      cur.server = null;
      resetChannel();
      toast('You were removed from that server.','bad');
    }
  });
  renderServers(); renderDMs(); renderOnline(); updateOnlinePill();
  onValue(ref(db,`friends/${me}`), s=&gt;{ friendsMap = s.val()||{}; renderDMs(); });
  onValue(ref(db,`friendRequests/${me}`), s=&gt;{ reqMap = s.val()||{}; renderDMs(); });
  setVanta(vantaKey);
  $('msgInput').focus();
}

function appendMsg(key, m){

  const dstr = new Date(m.t || Date.now()).toDateString();

    $('msgs').insertAdjacentHTML('beforeend', `&lt;div class=&quot;day-div&quot;&gt;&lt;span&gt;${dayLabel(m.t)}&lt;/span&gt;&lt;/div&gt;`);
  }

  $('msgs').insertAdjacentHTML('beforeend', msgHTML(key, m));

function updateMsg(key, m){
  if(!m || !m.u) return;
  const old = document.getElementById('m-'+key);
  if(!old) return appendMsg(key, m);   // not rendered yet — just append
  msgCache[key] = m;
  const stick = isPinned();
  const oldEmbHTML = old.querySelector('.embed')?.innerHTML || '';   // keep fetched embeds
  old.outerHTML = msgHTML(key, m);
  if(stick) $('msgs').scrollTop = $('msgs').scrollHeight;
  const el = document.getElementById('m-'+key);
  const emb = el &amp;&amp; el.querySelector('.embed');
  if(emb){

}

/* ================= LINK EMBEDS ================= */
const URL_RE = /(https?:\/\/[^\s&lt;&gt;&quot;']+)/g;
const linkify = t =&gt; t.replace(URL_RE, m=&gt;`&lt;a href=&quot;${m}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;${m}&lt;/a&gt;`);
async function buildEmbed(el, url){
  try{
    // direct image link
    if(/\.(png|jpe?g|gif|webp|avif|svg)([?#]|$)/i.test(url)){
      el.innerHTML = `&lt;img class=&quot;embed-img&quot; src=&quot;${esc(url)}&quot; loading=&quot;lazy&quot; alt=&quot;&quot;&gt;`; return;
    }
    // known players
    let mt = url.match(/(?:youtube\.com\/(?:watch\?.*?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
    if(mt){ el.innerHTML = `&lt;iframe class=&quot;embed-vid&quot; src=&quot;https://www.youtube-nocookie.com/embed/${esc(mt[1])}&quot; allow=&quot;accelerometer; autoplay; encrypted-media; picture-in-picture&quot; allowfullscreen loading=&quot;lazy&quot; frameborder=&quot;0&quot;&gt;&lt;/iframe&gt;`; return; }
    mt = url.match(/open\.spotify\.com\/(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/);
    if(mt){ el.innerHTML = `&lt;iframe class=&quot;embed-sm&quot; src=&quot;https://open.spotify.com/embed/${esc(mt[1])}/${esc(mt[2])}&quot; allow=&quot;encrypted-media&quot; loading=&quot;lazy&quot; frameborder=&quot;0&quot;&gt;&lt;/iframe&gt;`; return; }
    if(/soundcloud\.com\//.test(url)){
      el.innerHTML = `&lt;iframe class=&quot;embed-sm&quot; src=&quot;https://w.soundcloud.com/player/?url=${encodeURIComponent(url)}&amp;color=8B7CF6&amp;hide_related=true&quot; loading=&quot;lazy&quot; frameborder=&quot;0&quot;&gt;&lt;/iframe&gt;`; return;
    }
    mt = url.match(/vimeo\.com\/(\d+)/);
    if(mt){ el.innerHTML = `&lt;iframe class=&quot;embed-vid&quot; src=&quot;https://player.vimeo.com/video/${esc(mt[1])}&quot; allow=&quot;autoplay; fullscreen&quot; allowfullscreen loading=&quot;lazy&quot; frameborder=&quot;0&quot;&gt;&lt;/iframe&gt;`; return; }
    // generic preview via noembed (free, CORS-friendly)
    const r = await fetch('https://noembed.com/embed?url='+encodeURIComponent(url));
    const j = await r.json();
    if(j &amp;&amp; !j.error &amp;&amp; (j.title || j.thumbnail_url)){
      el.innerHTML = `&lt;a class=&quot;embed-card&quot; href=&quot;${esc(url)}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;
        ${j.thumbnail_url?`&lt;img src=&quot;${esc(j.thumbnail_url)}&quot; loading=&quot;lazy&quot; alt=&quot;&quot;&gt;`:''}
        &lt;div class=&quot;ec-t&quot;&gt;&lt;b&gt;${esc(j.title||url)}&lt;/b&gt;&lt;span&gt;${esc(j.provider_name||'link')}&lt;/span&gt;&lt;/div&gt;&lt;/a&gt;`;
    }
  }catch{ /* stays a plain link */ }
}

/* ================= FILE UPLOADS (1 GB per file) ================= */
let upTask = null;
$('attachBtn').onclick = ()=&gt;{ if(!curPath) return toast('Open a server first.','bad'); $('fileInput').click(); };
$('fileInput').addEventListener('change', e=&gt;{
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  if(f.size &gt; MAX_FILE) return toast(`Too big — 1 GB max per file (this one: ${fmtSize(f.size)}).`,'bad');
  if(f.size === 0) return toast('That file is empty.','bad');
  const safe = f.name.replace(/[^\w.\- ]+/g,'_');
  const task = uploadBytesResumable(sref(storage, `files/${me}/${Date.now()}_${safe}`), f, {contentType: f.type || 'application/octet-stream'});
  upTask = task;
  $('upbar').hidden = false; $('upFill').style.width = '0%'; $('upName').textContent = `${f.name} · 0%`;
  task.on('state_changed',
    s=&gt;{ const pct = Math.floor(s.bytesTransferred / s.totalBytes * 100);
         $('upFill').style.width = pct+'%'; $('upName').textContent = `${f.name} · ${pct}%`; },
    err=&gt;{ $('upbar').hidden = true; upTask = null; if(err.code !== 'storage/canceled') toast('Upload failed — check Storage rules.','bad'); },
    async ()=&gt;{
      try{
        const url = await getDownloadURL(task.snapshot.ref);
        await push(ref(db,curPath), {u:me, t:Date.now(), type:'file', url, name:f.name, size:f.size, mime:f.type||''});
      }catch{ toast(&quot;Couldn't send the file message.&quot;,'bad'); }
      $('upbar').hidden = true; upTask = null;
    });
});
$('upCancel').onclick = ()=&gt;{ if(upTask) upTask.cancel(); $('upbar').hidden = true; };

function promptPw(what){

      &lt;p class=&quot;sub mono&quot;&gt;${esc(what)} is locked.&lt;/p&gt;

    setTimeout(()=&gt;$('mPwIn')?.focus(), 50);
  });
}
async function gateServer(sid, s){
  const pw = await promptPw(s.name || 'server');
  if(pw == null) return false;
  const stored = await getV(`roomPasswords/${sid}`);
  const h = stored &amp;&amp; (stored.h || stored);
  if(await sha256hex('server:'+pw) !== h){ toast('Wrong passcode.','bad'); return false; }
  userRoomsMap[sid] = Date.now();
  set(ref(db,`userRooms/${me}/${sid}`), Date.now()).catch(()=&gt;{});
  return true;
}
async function selectServer(sid, skipAuth){
  if(cur.server === sid) return;
  const s = serversMap[sid]; if(!s) return;
  // passcode gate — owner bypasses, unlocked members skip
  if(!skipAuth &amp;&amp; s.locked &amp;&amp; s.owner!==me &amp;&amp; !userRoomsMap[sid]){
    const ok = await gateServer(sid, s);
    if(!ok) return;
  }
  cur.server = sid; cur.dm = null;
  if(serverPres){ remove(serverPres).catch(()=&gt;{}); serverPres = null; }
  const r = ref(db, `presence/${me}/servers/${sid}`);
  try{ onDisconnect(r).remove(); set(r, Date.now()); }catch{}
  serverPres = r;
  openChannel(`messages/${sid}`, s.name || 'server', 'server');
  renderServers(); renderOnline(); updateOnlinePill(); maybeCloseSide();
}
async function joinServer(sid){
  const s = serversMap[sid] || await getV(`servers/${sid}`);
  if(!s) return toast('No server with that ID.','bad');
  closeModal();
  if(s.locked &amp;&amp; s.owner!==me &amp;&amp; !userRoomsMap[sid]){
    const ok = await gateServer(sid, s);
    if(!ok) return;
  }
  if(s.owner!==me &amp;&amp; s.hidden){
    userRoomsMap[sid] = Date.now();
    set(ref(db,`userRooms/${me}/${sid}`), Date.now()).catch(()=&gt;{});
    set(ref(db,`servers/${sid}/members/${me}`), Date.now()).catch(()=&gt;{});   // so the owner sees who joined
  }
  selectServer(sid, true);
}
function renderServers(){
  const es = Object.entries(serversMap)
    .sort((a,b)=&gt;(a[1].createdAt||0)-(b[1].createdAt||0))

  }catch{ toast(&quot;Couldn't add that member.&quot;,'bad'); }

async function removeMember(sid, u){

  try{

    remove(ref(db,`presence/${u}/servers/${sid}`)).catch(()=&gt;{});   // drop them from the online list too
    if(s.members) delete s.members[u];
    renderMemList(sid);
    toast(`${u} removed.`,'ok');
  }catch{ toast(&quot;Couldn't remove that member.&quot;,'bad'); }
}

function renderAdminServers(){
  const es = Object.entries(serversMap).sort((a,b)=&gt;(a[1].createdAt||0)-(b[1].createdAt||0));
  $('admSrvList').innerHTML = es.length ? es.map(([sid,s])=&gt;`
    &lt;div class=&quot;adm-row&quot;&gt;
      &lt;div class=&quot;info&quot;&gt;&lt;b&gt;${esc(s.name||'server')}&lt;/b&gt;
        &lt;div class=&quot;sub&quot;&gt;owner ${esc(s.owner||'?')} · since ${fmtDate(s.createdAt)}${s.locked?' · locked':''}${s.hidden?' · hidden':''} · ${Object.keys(s.members||{}).length} members · id ${sid}&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;acts&quot;&gt;
        &lt;button class=&quot;btn&quot; data-act=&quot;clear-srv&quot; data-sid=&quot;${sid}&quot;&gt;CLEAR MSGS&lt;/button&gt;
        &lt;button class=&quot;btn danger&quot; data-act=&quot;del-srv&quot; data-sid=&quot;${sid}&quot;&gt;DELETE&lt;/button&gt;
      &lt;/div&gt;&lt;/div&gt;`).join('') : '&lt;div class=&quot;empty&quot;&gt;No servers exist.&lt;/div&gt;';
}
function chipHTML(p, curIp){
  const ip = p.ip || '—';
  const banned = bannedIps[ipKey(ip)];
  return `&lt;span class=&quot;chip${ip===curIp?' cur':''}&quot; data-copy=&quot;${esc(ip)}&quot; title=&quot;click to copy&quot;&gt;${esc(ip)}&lt;i class=&quot;cnt&quot;&gt;·${p.count||1}×&lt;/i&gt;${banned?'&lt;i class=&quot;cnt&quot; style=&quot;color:var(--bad)&quot;&gt;BANNED&lt;/i&gt;':''}${banned?'':`&lt;button data-act=&quot;ban-ip&quot; data-ip=&quot;${esc(ip)}&quot;&gt;BAN&lt;/button&gt;`}&lt;/span&gt;`;
}
function renderNet(){
  const bl = Object.entries(bannedIps).sort((a,b)=&gt;(b[1].at||0)-(a[1].at||0));
  $('bannedIpList').innerHTML = bl.length ? bl.map(([k,v])=&gt;`
    &lt;div class=&quot;adm-row&quot;&gt;&lt;div class=&quot;info&quot;&gt;&lt;b class=&quot;mono&quot;&gt;${esc(v.ip||k)}&lt;/b&gt;
      &lt;div class=&quot;sub&quot;&gt;${esc(v.reason||'no reason')} · by ${esc(v.by||'?')} · ${fmtDate(v.at)}&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-act=&quot;unban-ip&quot; data-ip=&quot;${esc(v.ip||k)}&quot;&gt;UNBAN&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`).join('')
    : '&lt;div class=&quot;empty&quot;&gt;No banned IPs.&lt;/div&gt;';
  const ba = Object.entries(bannedUsers);
  $('bannedAccList').innerHTML = ba.length ? ba.map(([u,r])=&gt;`
    &lt;div class=&quot;adm-row&quot;&gt;&lt;div class=&quot;info&quot;&gt;&lt;b&gt;${esc(u)}&lt;/b&gt;
      &lt;div class=&quot;sub&quot;&gt;${esc(reasonOf(r))}&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;acts&quot;&gt;&lt;button class=&quot;btn&quot; data-act=&quot;unban-user&quot; data-u=&quot;${esc(u)}&quot;&gt;UNBAN&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`).join('')
    : '&lt;div class=&quot;empty&quot;&gt;No banned accounts.&lt;/div&gt;';
  const us = Object.entries(usersMap).sort((a,b)=&gt;(b[1].lastLogin||0)-(a[1].lastLogin||0));
  $('ipUsers').innerHTML = us.length ? us.map(([u,v])=&gt;{
    const ips = Object.values(v.ips||{}).sort((a,b)=&gt;(b.last||0)-(a.last||0));
    return `&lt;div class=&quot;ip-user&quot;&gt;
      &lt;div class=&quot;h&quot;&gt;&lt;b&gt;${esc(u)}&lt;/b&gt;&lt;span&gt;last login ${fmtDate(v.lastLogin)} · now ${esc(v.ip||'—')}&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;chips&quot;&gt;${ips.length ? ips.map(p=&gt;chipHTML(p, v.ip)).join('') : '&lt;span class=&quot;mono&quot; style=&quot;color:var(--faint);font-size:11px&quot;&gt;no IPs logged&lt;/span&gt;'}&lt;/div&gt;
    &lt;/div&gt;`;
  }).join('') : '&lt;div class=&quot;empty&quot;&gt;No registered users.&lt;/div&gt;';
}
async function renderLookup(u){
  lookupUser = u || null;
  const box = $('userCard');
  if(!u){ box.innerHTML = '&lt;div class=&quot;empty&quot;&gt;Enter a username to pull up their record.&lt;/div&gt;'; return; }
  const v = usersMap[u];
  if(!v){ box.innerHTML = `&lt;div class=&quot;empty&quot;&gt;No account called &quot;${esc(u)}&quot;.&lt;/div&gt;`; return; }
  const pres = presenceMap[u] || {};
  let fr = {};
  try{ fr = (await get(ref(db,`friends/${u}`))).val() || {}; }catch{}
  const ips = Object.values(v.ips||{}).sort((a,b)=&gt;(b.last||0)-(a.last||0));
  const av = v.avatar;
  box.innerHTML = `
    &lt;div class=&quot;ucard&quot;&gt;
      &lt;div class=&quot;uc-head&quot;&gt;
        ${av?`&lt;div class=&quot;ava&quot;&gt;&lt;img src=&quot;${esc(av)}&quot; alt=&quot;&quot;&gt;&lt;/div&gt;`:`&lt;div class=&quot;ava&quot; style=&quot;background:${uColor(u)}&quot;&gt;${esc(u[0].toUpperCase())}&lt;/div&gt;`}
        &lt;div&gt;&lt;b style=&quot;color:${nameColor(u)}&quot;&gt;${esc(u)}&lt;/b&gt;
          &lt;div class=&quot;st&quot;&gt;${pres.online ? `&lt;span style=&quot;color:var(--ok)&quot;&gt;ONLINE&lt;/span&gt; · ip ${esc(pres.ip||'?')}` : 'OFFLINE'}&lt;/div&gt;&lt;/div&gt;
        ${bannedUsers[u] ? '&lt;span class=&quot;tagb&quot;&gt;BANNED&lt;/span&gt;' : ''}
      &lt;/div&gt;
      &lt;div class=&quot;u-meta&quot;&gt;
        &lt;div&gt;&lt;i&gt;joined&lt;/i&gt;&lt;b&gt;${fmtDate(v.createdAt)}&lt;/b&gt;&lt;/div&gt;
        &lt;div&gt;&lt;i&gt;last login&lt;/i&gt;&lt;b&gt;${fmtDate(v.lastLogin)}&lt;/b&gt;&lt;/div&gt;
        &lt;div&gt;&lt;i&gt;current ip&lt;/i&gt;&lt;b class=&quot;mono&quot;&gt;${esc(v.ip||'—')}&lt;/b&gt;&lt;/div&gt;
        &lt;div&gt;&lt;i&gt;ips tracked&lt;/i&gt;&lt;b&gt;${ips.length}/${MAX_IPS}&lt;/b&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;lbl&quot;&gt;IP history (max ${MAX_IPS})&lt;/div&gt;
      &lt;div class=&quot;chips&quot;&gt;${ips.length ? ips.map(p=&gt;chipHTML(p, v.ip)).join('') : '&lt;span class=&quot;mono muted&quot; style=&quot;font-size:11px&quot;&gt;none logged&lt;/span&gt;'}&lt;/div&gt;
      &lt;div class=&quot;lbl&quot;&gt;Friends (${Object.keys(fr).length})&lt;/div&gt;
      &lt;div class=&quot;chips&quot;&gt;${Object.keys(fr).map(f=&gt;`&lt;span class=&quot;chip plain&quot;&gt;${esc(f)}&lt;/span&gt;`).join('') || '&lt;span class=&quot;mono muted&quot; style=&quot;font-size:11px&quot;&gt;none&lt;/span&gt;'}&lt;/div&gt;
      &lt;div class=&quot;lbl&quot;&gt;Admin actions&lt;/div&gt;
      &lt;div class=&quot;uc-acts&quot;&gt;
        &lt;input id=&quot;ucReason&quot; placeholder=&quot;reason (optional, used for bans)&quot;&gt;
        &lt;button class=&quot;btn danger&quot; data-act=&quot;ban-user&quot; data-u=&quot;${esc(u)}&quot;&gt;${bannedUsers[u]?'BAN (update)':'BAN ACCOUNT'}&lt;/button&gt;
        &lt;button class=&quot;btn danger&quot; data-act=&quot;ban-cur-ip&quot; data-ip=&quot;${esc(v.ip||'')}&quot; data-u=&quot;${esc(u)}&quot;&gt;BAN CURRENT IP&lt;/button&gt;
        &lt;button class=&quot;btn danger&quot; data-act=&quot;del-user&quot; data-u=&quot;${esc(u)}&quot;&gt;DELETE ACCOUNT&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;`;
}
$('lookupBtn').onclick = ()=&gt;renderLookup($('lookupInput').value.trim().toLowerCase());
$('lookupInput').addEventListener('keydown', e=&gt;{ if(e.key==='Enter'){ e.preventDefault(); $('lookupBtn').click(); } });
$('banIpGo').onclick = async ()=&gt;{
  const ip = $('banIpInput').value.trim();
  if(!/^[0-9a-fA-F.:]{3,45}$/.test(ip)) return toast(&quot;That doesn't look like an IP.&quot;,'bad');
  await admBanIp(ip, $('banIpReason').value.trim());
  $('banIpInput').value = ''; $('banIpReason').value = '';
  renderNet();
};

/* admin operations */
async function admClearServer(sid){
  if(!sid) return;
  try{ await remove(ref(db,`messages/${sid}`)); toast('Messages cleared.','ok'); }
  catch{ toast('Clear failed.','bad'); }
}
async function admDeleteServer(sid){
  if(!sid) return;
  try{
    await remove(ref(db,`messages/${sid}`));
    await remove(ref(db,`roomPasswords/${sid}`));
    await remove(ref(db,`servers/${sid}`));
    Object.keys(usersMap).forEach(u=&gt;{ remove(ref(db,`userRooms/${u}/${sid}`)).catch(()=&gt;{}); });
    Object.entries(presenceMap).forEach(([u,p])=&gt;{ if(p &amp;&amp; p.servers &amp;&amp; p.servers[sid]) remove(ref(db,`presence/${u}/servers/${sid}`)).catch(()=&gt;{}); });
    if(cur.server === sid){
      if(serverPres){ remove(serverPres).catch(()=&gt;{}); serverPres = null; }
      cur.server = null; resetChannel();
    }
    renderServers(); renderOnline(); updateOnlinePill();
    toast('Server deleted.','ok');
    renderAdminServers(); renderOverview();
  }catch{ toast('Delete failed.','bad'); }
}
async function admBanUser(u, reason){
  if(!u) return;
  const exists = usersMap[u] || await getV(`users/${u}`);
  if(!exists) return toast('No such account.','bad');
  try{
    await set(ref(db,`config/bannedUsers/${u}`), reason || `banned by ${me}`);
    await remove(ref(db,`presence/${u}`));
    toast(`${u} banned — they'll be disconnected.`,'ok');
    renderNet(); if(lookupUser===u) renderLookup(u);
  }catch{ toast('Ban failed.','bad'); }
}
async function admUnbanUser(u){
  try{ await remove(ref(db,`config/bannedUsers/${u}`)); toast(`${u} unbanned.`,'ok'); renderNet(); }
  catch{ toast('Unban failed.','bad'); }
}
async function admDeleteUser(u){
  if(!u) return;
  try{
    const fr = (await get(ref(db,`friends/${u}`))).val() || {};
    await Promise.all(Object.keys(fr).map(f=&gt;remove(ref(db,`friends/${f}/${u}`))));
    await Promise.all([
      remove(ref(db,`users/${u}`)), remove(ref(db,`presence/${u}`)),
      remove(ref(db,`friendRequests/${u}`)), remove(ref(db,`friends/${u}`))
    ]);
    toast(`Account ${u} deleted.`,'ok');
    renderNet(); renderLookup(u); renderOverview();
  }catch{ toast('Delete failed.','bad'); }
}
async function admBanIp(ip, reason){
  if(!ip) return;
  try{
    await set(ref(db,`config/bannedIps/${ipKey(ip)}`), {ip, reason: reason || 'banned', by: me, at: Date.now()});
    toast(`IP ${ip} banned.`,'ok');
    renderNet();
  }catch{ toast('IP ban failed.','bad'); }
}
async function admUnbanIp(ip){
  try{ await remove(ref(db,`config/bannedIps/${ipKey(ip)}`)); toast(`IP ${ip} unbanned.`,'ok'); renderNet(); }
  catch{ toast('Unban failed.','bad'); }
}
$('drawerBody').addEventListener('click', e=&gt;{
  const b = e.target.closest('button[data-act]');
  if(b){
    const a = b.dataset.act;
    if(a==='clear-srv')      arm(b, ()=&gt;admClearServer(b.dataset.sid));
    else if(a==='del-srv')   arm(b, ()=&gt;admDeleteServer(b.dataset.sid));
    else if(a==='chg-pw')    chgPwModal();
    else if(a==='ban-user')  arm(b, ()=&gt;admBanUser(b.dataset.u, ($('ucReason')||{}).value ? $('ucReason').value.trim() : ''));
    else if(a==='del-user')  arm(b, ()=&gt;admDeleteUser(b.dataset.u));
    else if(a==='ban-ip')    arm(b, ()=&gt;admBanIp(b.dataset.ip));
    else if(a==='ban-cur-ip')arm(b, ()=&gt;admBanIp(b.dataset.ip, 'linked to '+b.dataset.u));
    else if(a==='unban-ip')  admUnbanIp(b.dataset.ip);
    else if(a==='unban-user')admUnbanUser(b.dataset.u);
    return;
  }
  const chip = e.target.closest('.chip[data-copy]');
  if(chip &amp;&amp; !chip.classList.contains('plain')){
    try{ navigator.clipboard.writeText(chip.dataset.copy); toast('IP copied to clipboard.','ok'); }catch{}
  }
});

/* ================= GLOBAL LIVE LISTENERS (incl. live ban enforcement) ================= */
onValue(ref(db,'servers'), s=&gt;{
  serversMap = s.val()||{};
  if(me) renderServers();
});
onValue(ref(db,'users'), s=&gt;{
  usersMap = s.val()||{};
  const lu = $('loginUsers'); if(lu) lu.textContent = Object.keys(usersMap).length;   // login page stat
  if(me){
    if(!usersMap[me]) return forceLogout('Account deleted', 'your account was removed by an admin');
    renderMeChip(); refreshPanes(); refreshMsgStyles();   // live-update colors + avatars on screen
  }
});
onValue(ref(db,'presence'), s=&gt;{
  presenceMap = s.val()||{};
  if(me){
    renderOnline(); updateOnlinePill(); renderDMs(); refreshPanes();
    // member online-status in an open members modal
    if(!$('modalWrap').hidden &amp;&amp; $('memList')) renderMemList(curMemSid());
  }
});
onValue(ref(db,'config/admins'), s=&gt;{
  adminMap = s.val()||{};
  renderMeChip();
  if(drawerOpen &amp;&amp; !isAdmin()){ closeDrawer(); toast('Admin access revoked.','bad'); }
});
onValue(ref(db,'config/adminPw'), s=&gt;{
  adminPwHash = s.val();   // {h, set, by} — null until first set
  if(drawerOpen &amp;&amp; activeTab==='ovw') renderOverview();
});
onValue(ref(db,'config/bannedUsers'), s=&gt;{
  bannedUsers = s.val()||{};
  if(me &amp;&amp; bannedUsers[me]) return forceLogout('Account banned', reasonOf(bannedUsers[me]));
  if(drawerOpen &amp;&amp; activeTab==='net') renderNet();
});
onValue(ref(db,'config/bannedIps'), s=&gt;{
  bannedIps = s.val()||{};
  if(me &amp;&amp; myIp &amp;&amp; bannedIps[ipKey(myIp)]) return forceLogout(&quot;You're blocked&quot;, `your IP ${myIp} was banned`);
  if(drawerOpen &amp;&amp; activeTab==='net') renderNet();
});

// which server the open members modal belongs to (stored on the Add button)
function curMemSid(){
  const b = document.querySelector('#memGo');
  return b ? b.dataset.sid : null;
}

/* ================= MISC BINDINGS ================= */
$('logoutBtn').onclick = async ()=&gt;{
  try{
    if(serverPres) await remove(serverPres);
    await update(ref(db,`users/${me}`), {sessToken:null});
    await update(ref(db,`presence/${me}`), {online:false, lastSeen:Date.now()});
  }catch{}
  localStorage.removeItem('relay_session');
  location.reload();
};
$('kickReload').onclick = ()=&gt; location.reload();
document.addEventListener('keydown', e=&gt;{
  if(e.key !== 'Escape') return;
  if(!$('gifWrap').hidden) closeGif();
  else if(!$('modalWrap').hidden) closeModal();
  else if(drawerOpen) closeDrawer();
  else if(replyingTo) cancelReply();
});

/* ================= BOOT ================= */
document.querySelectorAll('[data-icon]').forEach(el=&gt;{ el.insertAdjacentHTML('afterbegin', I[el.dataset.icon] || ''); });
$('loginVer').textContent = 'v'+VERSION;
(async function boot(){
  await tryAutoLogin();
})();

		<script>
			var token = localStorage.getItem('token');
			var base = window.WEBUI_BASE_URL || '';
			var lang = localStorage.locale ?? (navigator.language.includes('zh') ? 'zh-CN' : 'en-US');
			var config = {
				credentials: 'include',
				headers: {
					Accept: 'application/json',
					'Content-Type': 'application/json',
					...(token ? { Authorization: `Bearer ${token}` } : {}),
					'Accept-Language': lang
				}
			};

			var sessionFetch = fetch(`${base}/api/v1/auths/`, config).then(async (res) => {
				if (!res.ok) throw await res.json();
				return res.json();
			});

			window.GLOBAL_FETCHES = {
				session: sessionFetch,
				config: fetch(`${base}/api/config`, config).then(async (res) => {
					if (!res.ok) throw await res.json();
					return res.json();
				}),
				// token 存在时与其他请求并行；不存在时需等 session 之后再请求 models
				// 至少要 cookie 里有 token 才能正常请求 models
				models: token
					? fetch(`${base}/api/models`, config)
					: sessionFetch.then(() => fetch(`${base}/api/models`, config)),
				settings:
					token &&
					fetch(`${base}/api/v1/users/user/settings`, config).then(async (res) => {
						if (!res.ok) throw await res.json();
						return res.json();
					})
			};
		</script>
